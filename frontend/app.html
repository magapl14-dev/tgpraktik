<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мои практики</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0c14">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Практики">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { background: #0a0c14; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; }
  .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
  .font-body    { font-family: 'Manrope', system-ui, sans-serif; color: #f4ead5; }
  .app-bg {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(212,168,87,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(127,179,211,0.05), transparent 50%),
      linear-gradient(180deg, #0d1018 0%, #0a0c14 100%);
    min-height: 100vh; min-height: 100dvh;
  }
  .card {
    background: linear-gradient(180deg, rgba(255,250,235,0.04) 0%, rgba(255,250,235,0.02) 100%);
    border: 1px solid rgba(244,234,213,0.08);
  }
  .card-done { background: linear-gradient(180deg, rgba(212,168,87,0.10), rgba(212,168,87,0.04));
               border: 1px solid rgba(212,168,87,0.25); }
  .input-field { background: rgba(255,250,235,0.04); border: 1px solid rgba(244,234,213,0.12);
                 color: #f4ead5; transition: all 0.2s; }
  .input-field:focus { outline: none; border-color: rgba(212,168,87,0.5); }
  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .pulse-undone { animation: pulseSoft 3s ease-in-out infinite; }
  @keyframes pulseSoft { 0%,100% { opacity: 1; } 50% { opacity: 0.75; } }
  .tab-active { color: #d4a857; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { scrollbar-width: none; }
  .heat-cell { width: 12px; height: 12px; border-radius: 3px; transition: transform 0.1s; }
  .heat-cell:active { transform: scale(0.85); }
  /* Рендер markdown-описаний практик/программ */
  .md-body { font-size: 14px; line-height: 1.55; color: rgba(244,234,213,0.88); word-wrap: break-word; }
  .md-body > *:first-child { margin-top: 0; }
  .md-body > *:last-child { margin-bottom: 0; }
  .md-body p { margin: 0.5em 0; }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; margin: 0.9em 0 0.35em; color: #f4ead5; line-height: 1.2; }
  .md-body h1 { font-size: 1.45em; }
  .md-body h2 { font-size: 1.25em; }
  .md-body h3 { font-size: 1.1em; }
  .md-body h4 { font-size: 1em; }
  .md-body strong { color: #f4ead5; font-weight: 600; }
  .md-body em { font-style: italic; opacity: 0.92; }
  .md-body ul, .md-body ol { margin: 0.4em 0 0.6em; padding-left: 1.25em; }
  .md-body li { margin: 0.18em 0; }
  .md-body ul li::marker { color: #d4a857; }
  .md-body ol li::marker { color: #d4a857; }
  .md-body blockquote { margin: 0.6em 0; padding: 0.3em 0.8em; border-left: 3px solid rgba(212,168,87,0.45); background: rgba(212,168,87,0.05); border-radius: 0 6px 6px 0; color: rgba(244,234,213,0.78); }
  .md-body code { background: rgba(244,234,213,0.08); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; font-family: ui-monospace, SFMono-Regular, monospace; }
  .md-body pre { background: rgba(244,234,213,0.06); padding: 0.7em 0.9em; border-radius: 8px; overflow-x: auto; margin: 0.6em 0; }
  .md-body pre code { background: transparent; padding: 0; }
  .md-body a { color: #d4a857; text-decoration: underline; text-underline-offset: 2px; }
  .md-body hr { border: none; border-top: 1px solid rgba(244,234,213,0.12); margin: 0.9em 0; }
</style>
</head>
<body class="font-body app-bg pb-24">
<div id="root" style="padding: 0 16px; max-width: 720px; margin: 0 auto;">
  <div style="text-align: center; padding: 60px 0; opacity: 0.6;" class="font-display text-xl">загружаем...</div>
</div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const tg = window.Telegram?.WebApp;
const initData = tg?.initData || '';
const userTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) { return ''; } })();
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0a0c14'); }

// Регистрируем Service Worker (PWA, оффлайн-кеш). В Telegram Mini App
// SW не работает, но регистрация просто упадёт молча.
if ('serviceWorker' in navigator && location.protocol === 'https:' && !initData) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ─── API ───
const api = async (path, opts = {}) => {
  const r = await fetch(path, {
    ...opts,
    credentials: 'include',
    headers: {
      'Content-Type': 'application/json',
      'X-Init-Data': initData,
      'X-User-TZ': userTz,
      ...(opts.headers || {}),
    },
  });
  // Не залогинен и не из Telegram — отправляем на /login
  if (r.status === 401 && !initData) {
    window.location.replace('/login');
    return new Promise(() => {});  // зависнем, чтобы вызывающий код не упал
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
  return r.json();
};

// ─── Иконки SVG ───
const Ic = ({d, size=18, sw=2, ...rest}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html: d}} {...rest}/>;
const Plus = (p) => <Ic d='<path d="M5 12h14"/><path d="M12 5v14"/>' {...p}/>;
const Minus = (p) => <Ic d='<path d="M5 12h14"/>' {...p}/>;
const Check = (p) => <Ic d='<path d="M20 6 9 17l-5-5"/>' {...p}/>;
const Circle = (p) => <Ic d='<circle cx="12" cy="12" r="10"/>' {...p}/>;
const Flame = (p) => <Ic d='<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>' {...p}/>;
const Target = (p) => <Ic d='<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>' {...p}/>;
const Trophy = (p) => <Ic d='<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>' {...p}/>;
const Sparkles = (p) => <Ic d='<path d="m12 3-1.9 5.8a2 2 0 0 1-1.287 1.288L3 12l5.8 1.9a2 2 0 0 1 1.288 1.287L12 21l1.9-5.8a2 2 0 0 1 1.287-1.288L21 12l-5.8-1.9a2 2 0 0 1-1.288-1.287Z"/>' {...p}/>;
const ChevronRight = (p) => <Ic d='<path d="m9 18 6-6-6-6"/>' {...p}/>;
const Calendar = (p) => <Ic d='<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>' {...p}/>;
const X = (p) => <Ic d='<path d="M18 6 6 18"/><path d="m6 6 12 12"/>' {...p}/>;
const SettingsIcon = (p) => <Ic d='<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>' {...p}/>;
const HistoryIcon = (p) => <Ic d='<path d="M3 12a9 9 0 1 0 9-9 9.74 9.74 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>' {...p}/>;
const Pause = (p) => <Ic d='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' {...p}/>;
const Logout = (p) => <Ic d='<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>' {...p}/>;
const ExternalLink = (p) => <Ic d='<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/>' {...p}/>;
const ArrowUp = (p) => <Ic d='<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>' {...p}/>;
const ArrowDown = (p) => <Ic d='<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>' {...p}/>;
const ListOrdered = (p) => <Ic d='<line x1="10" x2="21" y1="6" y2="6"/><line x1="10" x2="21" y1="12" y2="12"/><line x1="10" x2="21" y1="18" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>' {...p}/>;

// ─── Утилиты ───
const PALETTE = { sage: '#a3b18a', amber: '#d4a857', rose: '#c98e95', azure: '#7fb3d3',
                  plum: '#b399c4', rust: '#cf8770', mint: '#88c4b8', gold: '#e0bd6a' };
const todayKey = () => new Date().toISOString().slice(0, 10);
const dayN = (n) => n === 1 ? 'день' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'дня' : 'дней';
const ymd = (d) => d.toISOString().slice(0, 10);
const parseYmd = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtDate = (s) => { try { return new Date(s+'T00:00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'long'}); } catch(e) { return s; } };
const isDone = (p, e) => {
  if (!e) return false;
  switch (p.type) {
    case 'binary': return !!e.completed;
    case 'count':  return (e.count || 0) >= (p.target || 1);
    case 'text':   return !!(e.response_text || '').trim();
    case 'photo':  return !!e.response_photo;
    case 'video':  return !!(e.response_video_url || '').trim();
    case 'rounds': return !!e.completed;
    case 'timer':  return (e.count || 0) >= (p.target || 1);
    default:       return false;
  }
};

const compress = (file, maxDim = 700, q = 0.7) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = (ev) => { const img = new Image(); img.onload = () => {
    const c = document.createElement('canvas'); let w = img.width, h = img.height;
    if (w > h && w > maxDim) { h = h*(maxDim/w); w = maxDim; }
    else if (h >= w && h > maxDim) { w = w*(maxDim/h); h = maxDim; }
    c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    res(c.toDataURL('image/jpeg', q));
  }; img.onerror = rej; img.src = ev.target.result; };
  r.onerror = rej; r.readAsDataURL(file);
});

// Цвет ячейки heatmap по «доле выполнения» дня (0..1) или null = нейтральный
const heatColor = (ratio) => {
  if (ratio === null || ratio === undefined) return 'rgba(244,234,213,0.05)';
  if (ratio >= 1) return '#d4a857';
  if (ratio >= 0.5) return 'rgba(212,168,87,0.55)';
  if (ratio > 0) return 'rgba(212,168,87,0.28)';
  return 'rgba(244,234,213,0.10)';
};

// ─── Главный компонент ───
function App() {
  const [me, setMe] = useState(null);
  const [data, setData] = useState({ practices: [], history_practices: [], entries: {}, programs: [] });
  const [catalog, setCatalog] = useState([]);
  const [programsCatalog, setProgramsCatalog] = useState([]);
  const [categories, setCategories] = useState([]);
  const [board, setBoard] = useState([]);
  const [tab, setTab] = useState('today');
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');

  const [joining, setJoining] = useState(null);
  const [joiningProgram, setJoiningProgram] = useState(null);
  const [practiceDetail, setPracticeDetail] = useState(null);
  const [dateEntry, setDateEntry] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);

  const refresh = async () => {
    try {
      const [m, my, cat, cats, progs] = await Promise.all([
        api('/api/me'), api('/api/my'), api('/api/practices'),
        api('/api/categories'), api('/api/programs')
      ]);
      setMe(m); setData(my); setCatalog(cat); setCategories(cats); setProgramsCatalog(progs);
    } catch (e) { setErr(e.message); }
  };

  useEffect(() => {
    (async () => {
      try {
        await refresh();
        const lb = await api('/api/leaderboard?period=month');
        setBoard(lb);
      } catch (e) { setErr(e.message); }
      setLoading(false);
    })();
  }, []);

  if (loading) {
    return <div className="text-center pt-20 opacity-60 font-display text-xl">загружаем...</div>;
  }

  if (err && !me) {
    return (
      <div className="text-center pt-20 px-6">
        <p className="opacity-60 mb-2">Не получилось войти</p>
        <p className="text-sm opacity-40">{err}</p>
        {initData ? (
          <p className="text-xs opacity-30 mt-4">Сессия в Telegram могла протухнуть — закрой и открой бота заново.</p>
        ) : (
          <p className="text-xs opacity-30 mt-4">
            <a href="/login" style={{color:'#d4a857'}}>Войти через email</a> или открой бота в Telegram.
          </p>
        )}
      </div>
    );
  }

  return (
    <div>
      {tab === 'today' && <TodayTab data={data} onChange={refresh}
                                    onPracticeTap={setPracticeDetail}
                                    onSettings={() => setSettingsOpen(true)}
                                    muted={me?.muted}/>}
      {tab === 'catalog' && <CatalogTab catalog={catalog} categories={categories}
                                        joined={data.practices}
                                        programsCatalog={programsCatalog}
                                        joinedPrograms={data.programs || []}
                                        onJoin={setJoining}
                                        onJoinProgram={setJoiningProgram}/>}
      {tab === 'history' && <HistoryTab data={data} onPracticeTap={setPracticeDetail}/>}
      {tab === 'board' && <BoardTab board={board} me={me} onPeriod={async(p) => {
        try { setBoard(await api(`/api/leaderboard?period=${p}`)); } catch (e) { setErr(e.message); }
      }}/>}
      <TabBar tab={tab} setTab={setTab} isAdmin={me?.is_admin}/>
      {joining && <JoinSheet practice={joining} onClose={() => setJoining(null)} onJoined={async () => {
        setJoining(null); await refresh();
      }}/>}
      {joiningProgram && <ProgramJoinSheet program={joiningProgram}
        onClose={() => setJoiningProgram(null)}
        onJoined={async () => { setJoiningProgram(null); await refresh(); }}/>}
      {practiceDetail && <PracticeDetailSheet
                            practice={practiceDetail}
                            entries={data.entries}
                            today={data.today || todayKey()}
                            onClose={() => setPracticeDetail(null)}
                            onChange={refresh}
                            onDateTap={(d) => setDateEntry({practice: practiceDetail, date: d})}/>}
      {dateEntry && <DateEntrySheet
                        practice={dateEntry.practice}
                        date={dateEntry.date}
                        currentEntry={data.entries[`${dateEntry.date}_${dateEntry.practice.id}`]}
                        onClose={() => setDateEntry(null)}
                        onSaved={async () => { setDateEntry(null); await refresh(); }}/>}
      {settingsOpen && <SettingsSheet me={me} onClose={() => setSettingsOpen(false)} onChanged={refresh}/>}
    </div>
  );
}

// ─── Сегодня ───
function TodayTab({ data, onChange, onPracticeTap, onSettings, muted }) {
  const today = data.today || todayKey();
  const total = data.practices.length;
  const done = data.practices.filter((p) => isDone(p, data.entries[`${today}_${p.id}`])).length;
  const pct = total ? Math.round(done/total*100) : 0;

  // Локальный порядок практик — позволяет переставлять и сохранять приоритет.
  const [reorderMode, setReorderMode] = useState(false);
  const [order, setOrder] = useState(data.practices.map((p) => p.id));
  // Синхронизируем локальный порядок с серверным после refresh (новые/удалённые практики).
  useEffect(() => {
    const serverIds = data.practices.map((p) => p.id);
    const sameSet = serverIds.length === order.length && serverIds.every((id) => order.includes(id));
    if (!sameSet) setOrder(serverIds);
  }, [data.practices]);

  const orderedPractices = order
    .map((id) => data.practices.find((p) => p.id === id))
    .filter(Boolean);

  const movePractice = async (idx, dir) => {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= order.length) return;
    const next = order.slice();
    [next[idx], next[newIdx]] = [next[newIdx], next[idx]];
    setOrder(next);
    try { await api('/api/my/practices/reorder', { method:'POST', body: JSON.stringify({ order: next }) }); }
    catch (e) { /* откатываться не будем — на refresh подтянется как есть */ }
  };

  const fullCur = data.full_day_streak || 0;
  const fullBest = data.full_day_best || 0;
  const halfCur = data.half_day_streak || 0;
  const halfBest = data.half_day_best || 0;

  return (
    <div className="fade-in pt-6">
      <header className="mb-6">
        <div className="flex items-start justify-between">
          <div>
            <p className="text-xs uppercase tracking-widest opacity-50 mb-1">Сегодня</p>
            <h1 className="font-display text-4xl font-light leading-tight">Мои <em style={{color:'#d4a857'}}>практики</em></h1>
          </div>
          <button onClick={onSettings} className="opacity-60 hover:opacity-100 p-2 -mr-2"
                  aria-label="Настройки">
            <SettingsIcon size={20}/>
          </button>
        </div>

        {muted && (
          <div className="mt-3 px-3 py-2 rounded-xl text-xs flex items-center gap-2"
               style={{background:'rgba(127,179,211,0.10)', border:'1px solid rgba(127,179,211,0.25)', color:'#b8d3e6'}}>
            <Pause size={12}/>
            <span>Напоминания на паузе до завтра. Открой настройки, чтобы снять.</span>
          </div>
        )}

        {total > 0 && (
          <div className="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-sm">
            {fullCur > 0 && (
              <div className="flex items-center gap-1.5" style={{color:'#d4a857'}}>
                <Flame size={14}/>
                <span>{fullCur} {dayN(fullCur)} полностью</span>
                {fullBest > fullCur && <span className="opacity-50 text-xs">· рекорд {fullBest}</span>}
              </div>
            )}
            {halfCur > 0 && halfCur !== fullCur && (
              <div className="flex items-center gap-1.5 opacity-80" style={{color:'#e0bd6a'}}>
                <Flame size={12}/>
                <span className="text-xs">{halfCur} {dayN(halfCur)} наполовину+</span>
                {halfBest > halfCur && <span className="opacity-60 text-[10px]">· рекорд {halfBest}</span>}
              </div>
            )}
            {fullCur === 0 && halfCur === 0 && fullBest > 0 && (
              <div className="flex items-center gap-1.5 opacity-70" style={{color:'#d4a857'}}>
                <Flame size={12}/>
                <span className="text-xs">рекорд полных дней: {fullBest}</span>
              </div>
            )}
          </div>
        )}
      </header>

      {!total ? (
        <div className="text-center py-16 px-4">
          <Sparkles size={40} style={{color:'#d4a857'}} className="mx-auto mb-4"/>
          <h2 className="font-display text-2xl mb-2">Пока пусто</h2>
          <p className="opacity-60 text-sm max-w-xs mx-auto">
            Перейди в каталог и присоединись к практикам, которые хочешь делать.
          </p>
        </div>
      ) : (
        <>
          <div className="mb-5">
            <div className="flex items-baseline justify-between mb-1.5 text-sm">
              <span className="opacity-70">Прогресс</span>
              <span className="font-display text-xl"><span style={{color:'#d4a857'}}>{done}</span><span className="opacity-40"> / {total}</span></span>
            </div>
            <div className="h-1 rounded-full overflow-hidden" style={{background:'rgba(244,234,213,0.08)'}}>
              <div className="h-full transition-all duration-500" style={{width:`${pct}%`, background:'linear-gradient(90deg, #d4a857, #e0bd6a)'}}/>
            </div>
          </div>

          {total > 1 && (
            <div className="flex justify-end mb-2">
              <button onClick={() => setReorderMode((v) => !v)}
                      className="text-xs flex items-center gap-1.5 px-2.5 py-1 rounded-full transition"
                      style={reorderMode
                        ? {background:'rgba(212,168,87,0.18)', color:'#d4a857', border:'1px solid rgba(212,168,87,0.45)'}
                        : {background:'rgba(244,234,213,0.05)', color:'rgba(244,234,213,0.6)', border:'1px solid rgba(244,234,213,0.1)'}}>
                <ListOrdered size={12}/>
                {reorderMode ? 'Готово' : 'Порядок'}
              </button>
            </div>
          )}

          <div className="space-y-3">
            {orderedPractices.map((p, idx) => (
              <div key={p.id} className={reorderMode ? "flex items-stretch gap-2" : ""}>
                {reorderMode && (
                  <div className="flex flex-col gap-1 justify-center">
                    <button onClick={() => movePractice(idx, -1)} disabled={idx === 0}
                            className="p-1.5 rounded-lg disabled:opacity-25 transition"
                            style={{background:'rgba(212,168,87,0.12)', color:'#d4a857'}}
                            aria-label="Выше">
                      <ArrowUp size={14}/>
                    </button>
                    <button onClick={() => movePractice(idx, 1)} disabled={idx === orderedPractices.length - 1}
                            className="p-1.5 rounded-lg disabled:opacity-25 transition"
                            style={{background:'rgba(212,168,87,0.12)', color:'#d4a857'}}
                            aria-label="Ниже">
                      <ArrowDown size={14}/>
                    </button>
                  </div>
                )}
                <div className="flex-1 min-w-0">
                  <PracticeRow practice={p} entry={data.entries[`${today}_${p.id}`]}
                               onChange={onChange} onTap={() => onPracticeTap(p)}/>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {(data.programs || []).length > 0 && (
        <div className="mt-8">
          <h2 className="font-display text-2xl mb-3">Программы</h2>
          <div className="space-y-3">
            {data.programs.map((pr) => <ProgramCard key={pr.program_id} pr={pr}/>)}
          </div>
        </div>
      )}
    </div>
  );
}

function PracticeRow({ practice, entry, onChange, onTap }) {
  const [busy, setBusy] = useState(false);
  const [editingCount, setEditingCount] = useState(false);
  const [draft, setDraft] = useState('');
  const [responseOpen, setResponseOpen] = useState(false);
  const [roundsOpen,   setRoundsOpen]   = useState(false);
  const [timerOpen,    setTimerOpen]    = useState(false);
  const accent = PALETTE[practice.palette] || PALETTE.amber;
  const done = isDone(practice, entry);
  const count = entry?.count || 0;
  const streak = practice.streak || 0;
  const bestStreak = practice.best_streak || 0;
  const isResponseType = practice.type === 'text' || practice.type === 'photo' || practice.type === 'video';
  const isLauncherType = practice.type === 'rounds' || practice.type === 'timer';
  const hasExtras = (practice.extras || []).length > 0;
  // Для практик-«лаунчеров» (раунды/таймер) основная кнопка — старт таймера, даже если
  // есть extras-ответ: ответ открывается автоматически после завершения.
  const useUnifiedSheet = isResponseType || (hasExtras && !isLauncherType);

  const stop = (e) => e.stopPropagation();

  const updateBinary = async (e) => {
    stop(e);
    if (busy) return; setBusy(true);
    try { await api('/api/my/entry', { method:'POST', body: JSON.stringify({
      practice_id: practice.id, completed: !done }) }); await onChange(); }
    finally { setBusy(false); }
  };

  const updateCount = async (delta, e) => {
    if (e) stop(e);
    if (busy) return; setBusy(true);
    const newCount = Math.max(0, count + delta);
    try { await api('/api/my/entry', { method:'POST', body: JSON.stringify({
      practice_id: practice.id, count: newCount }) }); await onChange(); }
    finally { setBusy(false); }
  };

  const saveCount = async () => {
    const v = Math.max(0, parseInt(draft) || 0);
    setEditingCount(false);
    if (v === count) return;
    setBusy(true);
    try { await api('/api/my/entry', { method:'POST', body: JSON.stringify({
      practice_id: practice.id, count: v }) }); await onChange(); }
    finally { setBusy(false); }
  };

  const openResponse = (e) => { stop(e); setResponseOpen(true); };

  return (
    <>
    <div onClick={onTap}
         className={`card ${done ? 'card-done' : 'pulse-undone'} rounded-2xl p-4 cursor-pointer transition-transform active:scale-[0.995]`}>
      <div className="flex items-center gap-3">
        <div className="flex-shrink-0 w-12 h-12 rounded-xl flex items-center justify-center text-2xl overflow-hidden"
             style={{background: practice.photo ? 'transparent' : '#3d3520', border:`1px solid ${accent}33`}}>
          {practice.photo ? <img src={practice.photo} alt="" className="w-full h-full object-cover"/> : practice.icon}
        </div>
        <div className="flex-1 min-w-0">
          <h3 className="font-display text-lg leading-tight truncate" style={{color: done ? '#d4a857' : '#f4ead5'}}>{practice.name}</h3>
          <div className="flex items-center gap-3 mt-0.5 text-xs opacity-60">
            {streak > 0 && (
              <span className="flex items-center gap-1">
                <Flame size={11}/>{streak} {dayN(streak)}
                {bestStreak > streak && <span className="opacity-60 ml-0.5">· рекорд {bestStreak}</span>}
              </span>
            )}
            {streak === 0 && bestStreak > 0 && (
              <span className="flex items-center gap-1 opacity-70"><Flame size={11}/>рекорд {bestStreak}</span>
            )}
            {practice.type === 'count' && <span className="flex items-center gap-1"><Target size={11}/>{practice.target}{practice.unit ? ' '+practice.unit : ''}</span>}
            {practice.type === 'text'  && <span>ответ текстом</span>}
            {practice.type === 'photo' && <span>фото</span>}
            {practice.type === 'video' && <span>ссылка на видео</span>}
            {practice.type === 'rounds' && <span className="flex items-center gap-1"><Target size={11}/>{
              (practice.rounds_plan && practice.rounds_plan.length > 0)
                ? `${practice.rounds_plan.length} раундов`
                : `${practice.rounds_count}×${practice.work_seconds}с / ${practice.rest_seconds || 0}с`
            }</span>}
            {practice.type === 'timer'  && <span className="flex items-center gap-1"><Target size={11}/>до {practice.target}с {entry?.count ? `· рекорд ${entry.count}с` : ''}</span>}
          </div>
        </div>
        {useUnifiedSheet ? (
          <button onClick={openResponse}
            className="px-3 py-2 rounded-full text-xs whitespace-nowrap"
            style={{background: done ? 'linear-gradient(135deg, #d4a857, #b8902f)' : 'rgba(244,234,213,0.05)',
                    color: done ? '#1a1410' : '#f4ead5', border: done ? 'none' : '1.5px solid rgba(244,234,213,0.15)'}}>
            {done ? '✓ ответ' : 'ответ'}
          </button>
        ) : practice.type === 'timer' ? (
          <button onClick={(e) => { stop(e); setTimerOpen(true); }}
            className="px-3 py-2 rounded-full text-xs whitespace-nowrap"
            style={{background: done ? 'linear-gradient(135deg, #d4a857, #b8902f)' : 'rgba(244,234,213,0.05)',
                    color: done ? '#1a1410' : '#f4ead5', border: done ? 'none' : '1.5px solid rgba(244,234,213,0.15)'}}>
            {done ? `✓ ${entry?.count || 0}с` : (entry?.count ? `${entry.count}с · ещё` : '▶ старт')}
          </button>
        ) : practice.type === 'rounds' ? (
          <button onClick={(e) => { stop(e); setRoundsOpen(true); }}
            className="px-3 py-2 rounded-full text-xs whitespace-nowrap"
            style={{background: done ? 'linear-gradient(135deg, #d4a857, #b8902f)' : 'rgba(244,234,213,0.05)',
                    color: done ? '#1a1410' : '#f4ead5', border: done ? 'none' : '1.5px solid rgba(244,234,213,0.15)'}}>
            {done ? '✓ пройдено' : '▶ старт'}
          </button>
        ) : practice.type === 'binary' ? (
          <button onClick={updateBinary} disabled={busy}
            className="w-11 h-11 rounded-full flex items-center justify-center transition-transform active:scale-90"
            style={{background: done ? 'linear-gradient(135deg, #d4a857, #b8902f)' : 'rgba(244,234,213,0.05)',
                    color: done ? '#1a1410' : '#f4ead5', border: done ? 'none' : '1.5px solid rgba(244,234,213,0.15)'}}>
            {done ? <Check size={18} sw={3}/> : <Circle size={18} sw={1.5}/>}
          </button>
        ) : (
          <div onClick={stop} className="flex items-center gap-1 rounded-full px-1 py-1" style={{background:'rgba(244,234,213,0.05)', border:'1px solid rgba(244,234,213,0.1)'}}>
            <button onClick={(e) => updateCount(-1, e)} disabled={busy || count === 0} className="w-7 h-7 rounded-full flex items-center justify-center disabled:opacity-30"><Minus size={14}/></button>
            {editingCount ? (
              <input
                autoFocus type="number" inputMode="numeric" min="0"
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                onBlur={saveCount}
                onKeyDown={(e) => { if (e.key === 'Enter') { e.target.blur(); } if (e.key === 'Escape') { setEditingCount(false); } }}
                className="w-12 text-center bg-transparent outline-none font-display"
                style={{color: '#d4a857'}}
              />
            ) : (
              <button onClick={(e) => { stop(e); setDraft(String(count)); setEditingCount(true); }}
                      className="min-w-[2.6rem] text-center font-display leading-none px-1"
                      style={{color: done ? '#d4a857' : '#f4ead5'}}>
                {count}<span className="text-[10px] opacity-50">/{practice.target}</span>
              </button>
            )}
            <button onClick={(e) => updateCount(1, e)} disabled={busy} className="w-7 h-7 rounded-full flex items-center justify-center"
              style={{background: done ? 'linear-gradient(135deg, #d4a857, #b8902f)' : 'rgba(244,234,213,0.08)',
                      color: done ? '#1a1410' : '#f4ead5'}}><Plus size={14} sw={2.5}/></button>
          </div>
        )}
      </div>
    </div>
    {responseOpen && (
      <ResponseSheet practice={practice} entry={entry}
        onClose={() => setResponseOpen(false)}
        onSaved={async () => { setResponseOpen(false); await onChange(); }}/>
    )}
    {timerOpen && (
      <TimerRunner practice={practice} entry={entry}
        onClose={() => { setTimerOpen(false); if (hasExtras) setResponseOpen(true); }}
        onSaved={async (seconds) => {
          try { await api('/api/my/entry', { method:'POST', body: JSON.stringify({
            practice_id: practice.id, count: seconds }) }); }
          catch (e) { alert(e.message); }
          await onChange();
        }}/>
    )}
    {roundsOpen && (
      <RoundsRunner practice={practice} done={done}
        onClose={() => { setRoundsOpen(false); if (hasExtras) setResponseOpen(true); }}
        onFinished={async () => {
          try { await api('/api/my/entry', { method:'POST', body: JSON.stringify({
            practice_id: practice.id, completed: true }) }); }
          catch (e) { alert(e.message); }
          await onChange();
        }}/>
    )}
    </>
  );
}

function ResponseSheet({ practice, entry, onClose, onSaved }) {
  const accent = PALETTE[practice.palette] || PALETTE.amber;
  const extras = practice.extras || [];
  // Какие поля показывать
  const showBinary = practice.type === 'binary';
  const showCount  = practice.type === 'count';
  const showText   = practice.type === 'text'  || extras.includes('text');
  const showPhoto  = practice.type === 'photo' || extras.includes('photo');
  const showVideo  = practice.type === 'video' || extras.includes('video');
  const isResponseType = practice.type === 'text' || practice.type === 'photo' || practice.type === 'video';

  const [completed, setCompleted] = useState(!!entry?.completed);
  const [count,     setCount]     = useState(entry?.count || 0);
  const [text,      setText]      = useState(entry?.response_text || '');
  const [photo,     setPhoto]     = useState(entry?.response_photo || null);
  const [videoUrl,  setVideoUrl]  = useState(entry?.response_video_url || '');
  const [busy, setBusy] = useState(false);

  const handlePhoto = async (file) => {
    if (!file) return;
    try { setPhoto(await compress(file)); }
    catch (e) { alert('Не получилось обработать фото'); }
  };

  const buildBody = () => {
    const body = { practice_id: practice.id };
    if (showBinary) body.completed = completed;
    if (showCount)  body.count = Math.max(0, parseInt(count) || 0);
    if (showText)   body.response_text = text;
    if (showPhoto)  body.response_photo = photo || '';
    if (showVideo)  body.response_video_url = videoUrl;
    return body;
  };

  const save = async () => {
    setBusy(true);
    try {
      await api('/api/my/entry', { method:'POST', body: JSON.stringify(buildBody()) });
      await onSaved();
    } catch (e) { alert(e.message); setBusy(false); }
  };

  const clear = async () => {
    if (!confirm('Стереть сегодняшний ответ?')) return;
    setBusy(true);
    try {
      const body = { practice_id: practice.id };
      if (showBinary) body.completed = false;
      if (showCount)  body.count = 0;
      if (showText)   body.response_text = '';
      if (showPhoto)  body.response_photo = '';
      if (showVideo)  body.response_video_url = '';
      await api('/api/my/entry', { method:'POST', body: JSON.stringify(body) });
      await onSaved();
    } catch (e) { alert(e.message); setBusy(false); }
  };

  const fieldHint = (k) => {
    if (practice.type === k) return ' (обязательно)';
    return ' (по желанию)';
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{background:'rgba(0,0,0,0.6)'}} onClick={onClose}>
      <div className="w-full max-w-md rounded-t-3xl p-6 fade-in overflow-y-auto" style={{background:'#161824', maxHeight:'92vh'}} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-between items-start mb-4">
          <h2 className="font-display text-2xl">{practice.icon} {practice.name}</h2>
          <button onClick={onClose} className="opacity-60"><X size={20}/></button>
        </div>
        {practice.description && <div className="mb-4"><Markdown text={practice.description}/></div>}

        {showBinary && (
          <div className="mb-4">
            <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Факт за сегодня (обязательно)</p>
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => setCompleted(false)} className="py-3 rounded-xl text-sm"
                style={{background: !completed ? 'rgba(244,234,213,0.06)' : 'rgba(244,234,213,0.02)',
                        border: `1px solid ${!completed ? 'rgba(244,234,213,0.25)' : 'rgba(244,234,213,0.08)'}`}}>
                Не сделано
              </button>
              <button onClick={() => setCompleted(true)} className="py-3 rounded-xl text-sm font-medium"
                style={{background: completed ? 'linear-gradient(135deg, #d4a857, #b8902f)' : 'rgba(244,234,213,0.04)',
                        color: completed ? '#1a1410' : '#f4ead5',
                        border: completed ? 'none' : '1px solid rgba(244,234,213,0.1)'}}>
                Сделано ✓
              </button>
            </div>
          </div>
        )}

        {showCount && (
          <div className="mb-4">
            <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Сколько (обязательно) · цель {practice.target}{practice.unit ? ' '+practice.unit : ''}</p>
            <input type="number" inputMode="numeric" min="0" value={count}
              onChange={(e) => setCount(e.target.value)}
              className="w-full px-4 py-3 rounded-xl font-display text-2xl text-center"
              style={{background:'rgba(244,234,213,0.04)', border:'1px solid rgba(244,234,213,0.12)', color:'#f4ead5'}}/>
          </div>
        )}

        {showText && (
          <div className="mb-4">
            <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Текст{fieldHint('text')}</p>
            <textarea value={text} onChange={(e) => setText(e.target.value)} rows={5}
              placeholder="Напиши, что было сегодня…"
              className="w-full px-4 py-3 rounded-xl resize-none"
              style={{background:'rgba(244,234,213,0.04)', border:'1px solid rgba(244,234,213,0.12)', color:'#f4ead5'}}/>
          </div>
        )}

        {showPhoto && (
          <div className="mb-4">
            <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Фото{fieldHint('photo')}</p>
            {photo ? (
              <div className="relative rounded-xl overflow-hidden" style={{border:'1px solid rgba(244,234,213,0.1)'}}>
                <img src={photo} className="w-full max-h-72 object-contain" style={{background:'#0a0c14'}}/>
                <button onClick={() => setPhoto(null)} className="absolute top-2 right-2 w-8 h-8 rounded-full"
                  style={{background:'rgba(10,12,20,0.7)'}}>×</button>
              </div>
            ) : (
              <label className="block p-5 rounded-xl text-center text-sm opacity-70 cursor-pointer"
                style={{border:'1px dashed rgba(244,234,213,0.2)'}}>
                Загрузить фото
                <input type="file" accept="image/*" capture="user" className="hidden"
                  onChange={(e) => handlePhoto(e.target.files?.[0])}/>
              </label>
            )}
          </div>
        )}

        {showVideo && (
          <div className="mb-4">
            <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Ссылка на видео{fieldHint('video')}</p>
            <input type="url" value={videoUrl} onChange={(e) => setVideoUrl(e.target.value)}
              placeholder="https://..."
              className="w-full px-4 py-3 rounded-xl"
              style={{background:'rgba(244,234,213,0.04)', border:'1px solid rgba(244,234,213,0.12)', color:'#f4ead5'}}/>
          </div>
        )}

        <div className="flex gap-2 mt-2">
          {isDone(practice, entry) && (
            <button onClick={clear} disabled={busy}
              className="px-4 py-3 rounded-full text-sm"
              style={{border:'1px solid rgba(232,128,128,0.3)', color:'#e88080'}}>
              Стереть
            </button>
          )}
          <button onClick={save} disabled={busy}
            className="flex-1 py-3.5 rounded-full font-medium transition-transform active:scale-[0.99] disabled:opacity-50"
            style={{background:`linear-gradient(135deg, ${accent}, #b8902f)`, color:'#1a1410'}}>
            {busy ? 'Сохраняем...' : 'Сохранить'}
          </button>
        </div>
        {isResponseType && (
          <p className="text-[11px] opacity-50 text-center mt-3">Прошлые дни заморожены — изменить нельзя.</p>
        )}
      </div>
    </div>
  );
}

// ─── Таймер (секундомер: фиксируем сколько продержался) ───
function fmtSec(s) {
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60), sec = s % 60;
  return m > 0 ? `${m}:${String(sec).padStart(2, '0')}` : `${sec}с`;
}

function TimerRunner({ practice, entry, onClose, onSaved }) {
  const accent = PALETTE[practice.palette] || PALETTE.amber;
  const target = Math.max(1, practice.target || 60);
  const bestToday = entry?.count || 0;

  // 'idle' | 'run' | 'stopped'
  const [phase, setPhase] = useState('idle');
  const [elapsed, setElapsed] = useState(0);
  const startRef = useRef(0);
  const tickRef = useRef(null);
  const reachedRef = useRef(false);

  const stopTick = () => { if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; } };
  useEffect(() => () => stopTick(), []);

  const start = () => {
    setPhase('run');
    setElapsed(0);
    reachedRef.current = false;
    startRef.current = Date.now();
    playBeep(880, 180, 'square', 0.22); // старт
    tickRef.current = setInterval(() => {
      const e = Math.floor((Date.now() - startRef.current) / 1000);
      setElapsed(e);
      if (!reachedRef.current && e >= target) {
        reachedRef.current = true;
        // тройной аккорд — цель взята
        playBeep(660, 220, 'sine', 0.25);
        setTimeout(() => playBeep(880, 220, 'sine', 0.25), 230);
        setTimeout(() => playBeep(1175, 350, 'sine', 0.28), 470);
      }
    }, 200);
  };

  const stopAndSave = async () => {
    stopTick();
    const sec = Math.floor((Date.now() - startRef.current) / 1000);
    setElapsed(sec);
    setPhase('stopped');
    playBeep(330, 200, 'sine', 0.22);
    if (sec > 0) await onSaved(sec);
  };

  const close = () => { stopTick(); onClose(); };

  const reached = elapsed >= target;
  const ratio = Math.min(1, elapsed / target);
  const remaining = Math.max(0, target - elapsed);

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{background:'rgba(0,0,0,0.7)'}} onClick={close}>
      <div className="w-full max-w-md rounded-t-3xl p-6 fade-in" style={{background:'#161824'}} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-between items-start mb-4">
          <h2 className="font-display text-2xl">{practice.icon} {practice.name}</h2>
          <button onClick={close} className="opacity-60"><X size={20}/></button>
        </div>

        <p className="text-sm opacity-70 mb-1">Цель: {fmtSec(target)} ({target}с)</p>
        {bestToday > 0 && (
          <p className="text-sm mb-3" style={{color: bestToday >= target ? '#a3b18a' : accent}}>
            Сегодня лучший: <b>{fmtSec(bestToday)}</b> ({bestToday}с)
            {bestToday >= target ? ' — день засчитан ✓' : ` · до цели ещё ${target - bestToday}с`}
          </p>
        )}
        {practice.description && <div className="mb-4 text-xs"><Markdown text={practice.description}/></div>}

        <div className="rounded-2xl p-6 text-center mb-4" style={{background:'rgba(244,234,213,0.04)', border:'1px solid rgba(244,234,213,0.1)'}}>
          <div className="text-xs uppercase tracking-widest opacity-60 mb-2">
            {phase === 'idle'    && 'Готов?'}
            {phase === 'run'     && (reached ? 'Цель взята — держись!' : `До цели ${remaining}с`)}
            {phase === 'stopped' && (elapsed >= target ? 'Цель взята!' : 'Зафиксировано')}
          </div>
          <div className="font-display text-6xl leading-none mb-2"
               style={{color: reached ? '#a3b18a' : accent}}>
            {fmtSec(elapsed)}
          </div>
          <div className="h-1.5 rounded-full overflow-hidden mt-3" style={{background:'rgba(244,234,213,0.08)'}}>
            <div className="h-full transition-all" style={{
              width: `${ratio * 100}%`,
              background: reached ? '#a3b18a' : accent,
            }}/>
          </div>
        </div>

        <div className="flex gap-2">
          {phase === 'idle' && (
            <button onClick={start}
              className="flex-1 py-3.5 rounded-full font-medium"
              style={{background:`linear-gradient(135deg, ${accent}, #b8902f)`, color:'#1a1410'}}>
              ▶ Старт
            </button>
          )}
          {phase === 'run' && (
            <button onClick={stopAndSave}
              className="flex-1 py-3.5 rounded-full font-medium"
              style={{background:`linear-gradient(135deg, ${accent}, #b8902f)`, color:'#1a1410'}}>
              ⏹ Стоп и сохранить
            </button>
          )}
          {phase === 'stopped' && (
            <>
              <button onClick={start}
                className="flex-1 py-3.5 rounded-full font-medium"
                style={{background:`linear-gradient(135deg, ${accent}, #b8902f)`, color:'#1a1410'}}>
                ▶ Ещё попытка
              </button>
              <button onClick={close}
                className="px-5 py-3.5 rounded-full text-sm"
                style={{background:'rgba(244,234,213,0.06)', color:'#f4ead5'}}>
                Закрыть
              </button>
            </>
          )}
        </div>

        <p className="text-[11px] opacity-40 text-center mt-3">
          Сохраняется лучший результат за день. Повторная попытка перезапишет рекорд только если он выше.
        </p>
      </div>
    </div>
  );
}

// ─── Раунды (интервальный таймер со звуковыми сигналами) ───
// Три разных бипа:
//   • старт работы — высокий короткий (880 Гц, 180 мс)
//   • старт паузы  — низкий короткий (440 Гц, 180 мс)
//   • финал всех раундов — тройной восходящий аккорд
function playBeep(freq, ms, type = 'sine', vol = 0.25) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = playBeep._ctx || (playBeep._ctx = new AC());
    if (ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(ctx.destination);
    const now = ctx.currentTime;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + ms / 1000);
    o.start(now); o.stop(now + ms / 1000 + 0.02);
  } catch (e) { /* без звука — не критично */ }
}
const beepWork  = () => playBeep(880, 200, 'square', 0.22);
const beepRest  = () => playBeep(330, 220, 'sine',   0.22);
const beepFinal = () => {
  playBeep(660,  220, 'sine', 0.25);
  setTimeout(() => playBeep(880, 220, 'sine', 0.25), 230);
  setTimeout(() => playBeep(1175, 350, 'sine', 0.28), 470);
};
const beepTick  = () => playBeep(1000, 60, 'sine', 0.12); // короткий тик на последние секунды

function RoundsRunner({ practice, done, onClose, onFinished }) {
  const accent = PALETTE[practice.palette] || PALETTE.amber;
  // Если задан rounds_plan — используем его; иначе разворачиваем равномерный план из старых полей.
  const plan = (Array.isArray(practice.rounds_plan) && practice.rounds_plan.length > 0)
    ? practice.rounds_plan.map((r) => ({
        work: Math.max(1, parseInt(r.work) || 1),
        rest: Math.max(0, parseInt(r.rest) || 0),
        sound_url: r.sound_url || '',
      }))
    : Array.from({length: Math.max(1, practice.rounds_count || 1)}, () => ({
        work: Math.max(1, practice.work_seconds || 20),
        rest: Math.max(0, practice.rest_seconds || 0),
        sound_url: '',
      }));
  const rounds = plan.length;
  // Краткая сводка вверху: либо «N×Wс / Rс», либо «N раундов, разное время» если план неоднородный.
  const allSame = plan.every((r) => r.work === plan[0].work && r.rest === plan[0].rest && !r.sound_url);
  const work = plan[0].work, rest = plan[0].rest;

  const customAudioRef = useRef(null);
  const stopRoundSound = () => {
    const a = customAudioRef.current;
    if (a) { try { a.pause(); a.currentTime = 0; } catch (e) {} }
  };
  // Звук раунда играет в цикле и тянется до конца «работы». На паузе/конце раунда — глушим.
  const playRoundSound = (idx) => {
    stopRoundSound();
    const url = plan[idx - 1]?.sound_url;
    if (url) {
      try {
        if (!customAudioRef.current) customAudioRef.current = new Audio();
        const a = customAudioRef.current;
        a.src = url;
        a.loop = true;
        a.play().catch(() => beepWork());
      } catch (e) { beepWork(); }
    } else {
      beepWork();
    }
  };

  // phase: 'idle' | 'prep' | 'work' | 'rest' | 'done'
  const [phase, setPhase]       = useState('idle');
  const [roundIdx, setRoundIdx] = useState(1);   // 1..rounds
  const [secLeft, setSecLeft]   = useState(plan[0].work);
  const tickRef = useRef(null);

  const stopTimer = () => { if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; } };
  useEffect(() => () => {
    stopTimer();
    if (customAudioRef.current) { try { customAudioRef.current.pause(); } catch(e){} }
  }, []);

  const startTimer = (seconds, onZero) => {
    stopTimer();
    setSecLeft(seconds);
    let left = seconds;
    tickRef.current = setInterval(() => {
      left -= 1;
      if (left <= 3 && left > 0) beepTick();
      setSecLeft(left);
      if (left <= 0) { stopTimer(); onZero(); }
    }, 1000);
  };

  const goWork = (idx) => {
    setPhase('work'); setRoundIdx(idx);
    const cur = plan[idx - 1];
    playRoundSound(idx);
    startTimer(cur.work, () => {
      stopRoundSound();
      if (idx >= rounds) {
        beepFinal();
        setPhase('done');
        onFinished && onFinished();
      } else if (cur.rest > 0) {
        beepRest();
        setPhase('rest');
        startTimer(cur.rest, () => goWork(idx + 1));
      } else {
        goWork(idx + 1);
      }
    });
  };

  const start = () => {
    // короткая «преп»-фаза 3 сек, чтобы юзер успел приготовиться
    setPhase('prep'); setRoundIdx(1);
    startTimer(3, () => goWork(1));
  };

  const stop = () => { stopTimer(); stopRoundSound(); setPhase('idle'); setSecLeft(plan[0].work); };

  const close = () => { stopTimer(); stopRoundSound(); onClose(); };

  const phaseLabel = phase === 'prep' ? 'Приготовься'
                  : phase === 'work' ? 'РАБОТА'
                  : phase === 'rest' ? 'Пауза'
                  : phase === 'done' ? 'Готово!' : 'Старт';
  const phaseColor = phase === 'work' ? '#d4a857'
                  : phase === 'rest' ? '#7fb3d3'
                  : phase === 'done' ? '#a3b18a'
                  : '#f4ead5';

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{background:'rgba(0,0,0,0.7)'}} onClick={close}>
      <div className="w-full max-w-md rounded-t-3xl p-6 fade-in" style={{background:'#161824'}} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-between items-start mb-4">
          <h2 className="font-display text-2xl">{practice.icon} {practice.name}</h2>
          <button onClick={close} className="opacity-60"><X size={20}/></button>
        </div>

        <p className="text-sm opacity-70 mb-1">
          {allSame
            ? `${rounds} раундов · работа ${work}с ${rest > 0 ? `· пауза ${rest}с` : '· без пауз'}`
            : `${rounds} раундов · разное время по раундам`}
        </p>
        {practice.unit && <p className="text-sm opacity-80 mb-4">Задача в раунде: <b>{practice.unit}</b></p>}
        {practice.description && <div className="mb-4 text-xs"><Markdown text={practice.description}/></div>}

        <div className="rounded-2xl p-6 text-center mb-4" style={{background:'rgba(244,234,213,0.04)', border:'1px solid rgba(244,234,213,0.1)'}}>
          <div className="text-xs uppercase tracking-widest opacity-60 mb-2">
            {phase !== 'idle' && phase !== 'done' && `Раунд ${roundIdx} / ${rounds}`}
            {phase === 'done' && 'Все раунды завершены'}
            {phase === 'idle' && 'Готов начать?'}
          </div>
          {/* Инструкция текущего раунда — что делать прямо сейчас */}
          {phase === 'work' && plan[roundIdx - 1]?.note && (
            <p className="text-sm mb-3 whitespace-pre-wrap" style={{color:'#f4ead5'}}>
              {plan[roundIdx - 1].note}
            </p>
          )}
          {phase === 'rest' && roundIdx < rounds && plan[roundIdx]?.note && (
            <p className="text-xs mb-3 opacity-70 whitespace-pre-wrap">
              След.: {plan[roundIdx].note}
            </p>
          )}
          {phase === 'idle' && plan[0]?.note && (
            <p className="text-xs mb-3 opacity-70 whitespace-pre-wrap">
              1-й раунд: {plan[0].note}
            </p>
          )}
          <div className="font-display text-6xl leading-none mb-2" style={{color: phaseColor}}>
            {phase === 'idle' ? plan[0].work : secLeft}
          </div>
          <div className="text-sm uppercase tracking-wider" style={{color: phaseColor, opacity: 0.85}}>
            {phaseLabel}
          </div>
        </div>

        <div className="flex gap-2">
          {(phase === 'idle' || phase === 'done') && (
            <button onClick={start}
              className="flex-1 py-3.5 rounded-full font-medium"
              style={{background:`linear-gradient(135deg, ${accent}, #b8902f)`, color:'#1a1410'}}>
              {phase === 'done' ? '▶ Ещё раз' : '▶ Старт'}
            </button>
          )}
          {(phase === 'work' || phase === 'rest' || phase === 'prep') && (
            <button onClick={stop}
              className="flex-1 py-3.5 rounded-full font-medium"
              style={{border:'1px solid rgba(232,128,128,0.4)', color:'#e88080'}}>
              Стоп
            </button>
          )}
          {phase === 'done' && (
            <button onClick={close}
              className="px-5 py-3.5 rounded-full text-sm"
              style={{background:'rgba(244,234,213,0.06)', color:'#f4ead5'}}>
              Закрыть
            </button>
          )}
        </div>

        {done && phase === 'idle' && (
          <p className="text-[11px] opacity-50 text-center mt-3">Сегодня уже отмечено как пройденное — можешь пройти ещё раз.</p>
        )}
        <p className="text-[11px] opacity-40 text-center mt-3">
          Высокий сигнал — старт работы · низкий — пауза · тройной — конец
        </p>
      </div>
    </div>
  );
}

// ─── Каталог (иерархический) ───
// Алгоритм: текущий узел currentCategoryId; собираем descendants → фильтруем catalog.
// Подкатегории текущего узла показываем сверху как чипсы.
const buildCatTree = (cats) => {
  const byParent = {};
  cats.forEach(c => {
    const k = c.parent_id || 'ROOT';
    (byParent[k] = byParent[k] || []).push(c);
  });
  Object.values(byParent).forEach(arr => arr.sort((a,b) =>
    (a.sort_order - b.sort_order) || a.name.localeCompare(b.name, 'ru')));
  return byParent;
};

const collectDescendants = (byParent, rootId) => {
  const ids = new Set();
  const walk = (k) => (byParent[k] || []).forEach(c => { ids.add(c.id); walk(c.id); });
  if (rootId) { ids.add(rootId); walk(rootId); }
  return ids;
};

const buildPath = (cats, id) => {
  const byId = Object.fromEntries(cats.map(c => [c.id, c]));
  const out = [];
  let cur = id ? byId[id] : null;
  while (cur) { out.unshift(cur); cur = cur.parent_id ? byId[cur.parent_id] : null; }
  return out;
};

function CatalogTab({ catalog, categories, joined, programsCatalog, joinedPrograms, onJoin, onJoinProgram }) {
  const [currentCatId, setCurrentCatId] = useState(null);
  const [filters, setFilters] = useState({ frequency: [], activity: [], inventory: [], location: [] });
  const [filtersOpen, setFiltersOpen] = useState(false);
  const joinedIds = new Set(joined.map((p) => p.id));
  const joinedProgIds = new Set((joinedPrograms || []).map((p) => p.program_id));
  const byParent = useMemo(() => buildCatTree(categories), [categories]);
  const childCats = byParent[currentCatId || 'ROOT'] || [];
  const path = buildPath(categories, currentCatId);

  // Активный счётчик фильтров (для бейджа на кнопке)
  const filtersActive = filters.frequency.length + filters.activity.length
                     + filters.inventory.length + filters.location.length;

  // Какие значения тегов вообще существуют в каталоге (для подсказок в шторке)
  const availableTags = useMemo(() => {
    const acc = { frequency: new Set(), activity: new Set(), inventory: new Set(), location: new Set() };
    for (const p of catalog) {
      (p.tag_frequency || []).forEach(t => acc.frequency.add(t));
      (p.tag_activity  || []).forEach(t => acc.activity.add(t));
      (p.tag_inventory || []).forEach(t => acc.inventory.add(t));
      (p.tag_location  || []).forEach(t => acc.location.add(t));
    }
    return { frequency: [...acc.frequency], activity: [...acc.activity],
             inventory: [...acc.inventory], location: [...acc.location] };
  }, [catalog]);

  // Фильтр практик: категория + теги. Тег внутри группы — OR, между группами — AND.
  const visiblePractices = useMemo(() => {
    let list = catalog;
    if (currentCatId) {
      const allowedIds = collectDescendants(byParent, currentCatId);
      list = list.filter(p => (p.category_ids || []).some(id => allowedIds.has(id)));
    }
    const matchGroup = (selected, pTags) =>
      selected.length === 0 || selected.some(t => (pTags || []).includes(t));
    return list.filter(p =>
      matchGroup(filters.frequency, p.tag_frequency) &&
      matchGroup(filters.activity,  p.tag_activity)  &&
      matchGroup(filters.inventory, p.tag_inventory) &&
      matchGroup(filters.location,  p.tag_location)
    );
  }, [catalog, currentCatId, byParent, filters]);

  return (
    <div className="fade-in pt-6">
      <header className="mb-4">
        <div className="flex items-start justify-between gap-2">
          <div className="flex-1 min-w-0">
            <p className="text-xs uppercase tracking-widest opacity-50 mb-1">Каталог</p>
            <h1 className="font-display text-4xl font-light leading-tight">
              {currentCatId ? <span><em style={{color:'#d4a857'}}>{path[path.length-1]?.name}</em></span>
                            : <>Выбери <em style={{color:'#d4a857'}}>практику</em></>}
            </h1>
          </div>
          <button onClick={() => setFiltersOpen(true)}
            className="px-3 py-1.5 rounded-full text-sm whitespace-nowrap flex items-center gap-1.5"
            style={{
              background: filtersActive ? 'rgba(212,168,87,0.15)' : 'rgba(244,234,213,0.04)',
              border: `1px solid ${filtersActive ? 'rgba(212,168,87,0.4)' : 'rgba(244,234,213,0.1)'}`,
              color: filtersActive ? '#d4a857' : '#f4ead5',
            }}>
            фильтры{filtersActive ? ` · ${filtersActive}` : ''}
          </button>
        </div>
        {!currentCatId && (
          <p className="opacity-60 text-sm mt-2">Тапни категорию чтобы сузить выбор, или прокрути все практики ниже.</p>
        )}
      </header>

      {/* Хлебные крошки */}
      {currentCatId && (
        <div className="flex items-center gap-1 mb-4 text-sm overflow-x-auto scrollbar-hide flex-nowrap">
          <button onClick={() => setCurrentCatId(null)} className="opacity-70 hover:opacity-100 whitespace-nowrap">Все</button>
          {path.map((c, i) => (
            <React.Fragment key={c.id}>
              <span className="opacity-30">/</span>
              <button onClick={() => setCurrentCatId(c.id)}
                      className={`whitespace-nowrap ${i === path.length-1 ? '' : 'opacity-70 hover:opacity-100'}`}
                      style={{color: i === path.length-1 ? '#d4a857' : undefined}}>
                {c.name}
              </button>
            </React.Fragment>
          ))}
        </div>
      )}

      {/* Подкатегории */}
      {childCats.length > 0 && (
        <div className="grid grid-cols-2 gap-2 mb-5">
          {childCats.map((c) => {
            const allowed = collectDescendants(byParent, c.id);
            const cnt = catalog.filter(p => (p.category_ids || []).some(id => allowed.has(id))).length;
            return (
              <button key={c.id} onClick={() => setCurrentCatId(c.id)}
                      className="card rounded-xl p-3 text-left transition-all active:scale-[0.99]">
                <div className="flex items-center gap-2">
                  {c.icon && <span className="text-lg">{c.icon}</span>}
                  <div className="flex-1 min-w-0">
                    <div className="font-display text-base leading-tight truncate">{c.name}</div>
                    <div className="text-[11px] opacity-50">{cnt} {cnt === 1 ? 'практика' : (cnt >= 2 && cnt <= 4) ? 'практики' : 'практик'}</div>
                  </div>
                  <ChevronRight size={16} className="opacity-40"/>
                </div>
              </button>
            );
          })}
        </div>
      )}

      {/* Программы — показываем только в корне */}
      {!currentCatId && (programsCatalog || []).length > 0 && (
        <div className="mb-6">
          <h3 className="font-display text-xl mb-2">Программы</h3>
          <div className="space-y-2">
            {programsCatalog.map((pr) => {
              const isJoined = joinedProgIds.has(pr.id);
              const accent = PALETTE[pr.palette] || PALETTE.amber;
              return (
                <button key={pr.id} onClick={() => !isJoined && onJoinProgram(pr)} disabled={isJoined}
                  className={`card rounded-2xl p-4 w-full text-left transition-all ${!isJoined ? 'active:scale-[0.99]' : 'opacity-60'}`}>
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-xl flex items-center justify-center text-2xl flex-shrink-0"
                         style={{background: '#3d3520', border: `1px solid ${accent}33`}}>
                      {pr.icon || '🎯'}
                    </div>
                    <div className="flex-1 min-w-0">
                      <h4 className="font-display text-lg leading-tight">{pr.name}</h4>
                      {pr.description && <p className="text-xs opacity-60 mt-0.5 line-clamp-2">{pr.description}</p>}
                      <div className="text-[11px] opacity-50 mt-1">
                        {pr.total_levels} уровн. · {pr.on_miss === 'reset' ? 'сброс при пропуске' : 'продолжение при пропуске'}
                      </div>
                    </div>
                    {isJoined ? <span className="text-xs px-2 py-1 rounded-full" style={{background:'rgba(212,168,87,0.15)', color:'#d4a857'}}>в моих</span>
                              : <ChevronRight size={20} className="opacity-40"/>}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Список практик */}
      {visiblePractices.length === 0 ? (
        <p className="opacity-50 text-center py-12 text-sm">
          {currentCatId ? 'В этой категории пока нет практик.' : 'Пока нет ни одной практики. Админ ещё их добавляет.'}
        </p>
      ) : (
        <div className="space-y-3">
          {visiblePractices.map((p) => {
            const accent = PALETTE[p.palette] || PALETTE.amber;
            const isJoined = joinedIds.has(p.id);
            return (
              <button key={p.id} onClick={() => !isJoined && onJoin(p)} disabled={isJoined}
                className={`card rounded-2xl p-4 w-full text-left transition-all ${!isJoined ? 'active:scale-[0.99]' : 'opacity-60'}`}>
                <div className="flex items-center gap-3">
                  <div className="w-14 h-14 rounded-xl flex items-center justify-center text-3xl overflow-hidden flex-shrink-0"
                       style={{background: p.photo ? 'transparent' : '#3d3520', border:`1px solid ${accent}33`}}>
                    {p.photo ? <img src={p.photo} alt="" className="w-full h-full object-cover"/> : p.icon}
                  </div>
                  <div className="flex-1 min-w-0">
                    <h3 className="font-display text-xl leading-tight">{p.name}</h3>
                    {p.description && <p className="text-xs opacity-60 mt-0.5 line-clamp-2">{p.description}</p>}
                    <div className="flex items-center gap-2 mt-1 text-[11px] opacity-50">
                      {p.type === 'count' ? <span>цель: {p.target}{p.unit ? ' '+p.unit : ''}</span> : <span>отметка факта</span>}
                      {p.max_reminders > 0 && <span>• до {p.max_reminders} напом.</span>}
                    </div>
                    {(p.tag_frequency?.length || p.tag_activity?.length || p.tag_inventory?.length || p.tag_location?.length) ? (
                      <div className="flex flex-wrap gap-1 mt-2">
                        {(p.tag_frequency || []).map(t => <Chip key={'f-'+t} text={t}/>)}
                        {(p.tag_activity  || []).map(t => <Chip key={'a-'+t} text={t}/>)}
                        {(p.tag_inventory || []).map(t => <Chip key={'i-'+t} text={t} muted/>)}
                        {(p.tag_location  || []).map(t => <Chip key={'l-'+t} text={t} muted/>)}
                      </div>
                    ) : null}
                  </div>
                  {isJoined ? <span className="text-xs px-2 py-1 rounded-full" style={{background:'rgba(212,168,87,0.15)', color:'#d4a857'}}>в моих</span>
                            : <ChevronRight size={20} className="opacity-40"/>}
                </div>
              </button>
            );
          })}
        </div>
      )}

      {filtersOpen && (
        <FilterSheet
          available={availableTags}
          value={filters}
          onChange={setFilters}
          onClose={() => setFiltersOpen(false)}/>
      )}
    </div>
  );
}

function Chip({ text, muted }) {
  return (

function FilterSheet({ available, value, onChange, onClose }) {
  const groups = [
    { key: 'frequency', label: 'Частота / время',
      fallback: ['ежедневная','утренняя','дневная','вечерняя','несколько раз в день','несколько раз в неделю','разовая'] },
    { key: 'activity',  label: 'Активность',
      fallback: ['пассивная','спокойная','умеренная','активная','интенсивная'] },
    { key: 'inventory', label: 'Инвентарь',
      fallback: [] },
    { key: 'location',  label: 'Место',
      fallback: [] },
  ];
  // Реальные опции = подсказки + всё что реально есть в каталоге
  const optsFor = (g) => {
    const arr = [...new Set([...(g.fallback || []), ...(available[g.key] || [])])];
    return arr;
  };
  const toggle = (k, t) => {
    const sel = value[k] || [];
    onChange({ ...value, [k]: sel.includes(t) ? sel.filter(x => x !== t) : [...sel, t] });
  };
  const reset = () => onChange({ frequency: [], activity: [], inventory: [], location: [] });
  const total = (value.frequency.length + value.activity.length + value.inventory.length + value.location.length);

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{background:'rgba(0,0,0,0.6)'}} onClick={onClose}>
      <div className="w-full max-w-md rounded-t-3xl p-6 fade-in overflow-y-auto" style={{background:'#161824', maxHeight:'92vh'}} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-between items-start mb-4">
          <h2 className="font-display text-2xl">Фильтры</h2>
          <button onClick={onClose} className="opacity-60"><X size={20}/></button>
        </div>
        {groups.map((g) => {
          const opts = optsFor(g);
          if (opts.length === 0) return null;
          return (
            <div key={g.key} className="mb-4">
              <p className="text-xs uppercase tracking-wider opacity-50 mb-2">{g.label}</p>
              <div className="flex flex-wrap gap-1.5">
                {opts.map((t) => {
                  const on = (value[g.key] || []).includes(t);
                  return (
                    <button key={t} onClick={() => toggle(g.key, t)} className="px-3 py-1 rounded-full text-xs"
                      style={{
                        background: on ? 'rgba(212,168,87,0.15)' : 'rgba(244,234,213,0.04)',
                        border: `1px solid ${on ? 'rgba(212,168,87,0.4)' : 'rgba(244,234,213,0.1)'}`,
                        color: on ? '#d4a857' : '#f4ead5',
                      }}>{t}</button>
                  );
                })}
              </div>
            </div>
          );
        })}
        <div className="flex gap-2 mt-5">
          <button onClick={reset} disabled={total === 0}
            className="px-4 py-3 rounded-full text-sm disabled:opacity-40"
            style={{border:'1px solid rgba(244,234,213,0.15)'}}>
            Сбросить
          </button>
          <button onClick={onClose}
            className="flex-1 py-3 rounded-full font-medium"
            style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
            Применить{total ? ` (${total})` : ''}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Универсальная сборка истории по дням ───
// Возвращает массив объектов {date, ratio|null, neutral, today, doneCount, activeCount}
// для одной практики или для общего обзора.
function buildHeatmap({ historyPractices, entries, today, days = 70, practiceId = null }) {
  const todayD = parseYmd(today);
  const arr = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(todayD); d.setDate(todayD.getDate() - i);
    const key = ymd(d);
    let active = 0, done = 0;
    for (const p of historyPractices) {
      if (practiceId && p.id !== practiceId) continue;
      if (key < p.period_start) continue;
      if (p.period_end && key > p.period_end) continue;
      active++;
      const e = entries[`${key}_${p.id}`];
      if (!e) continue;
      if (isDone(p, e)) done++;
    }
    arr.push({
      date: key,
      ratio: active === 0 ? null : done / active,
      activeCount: active,
      doneCount: done,
      neutral: active === 0,
      today: key === today,
    });
  }
  return arr;
}

// ─── История ───
function HistoryTab({ data, onPracticeTap }) {
  const today = data.today || todayKey();
  const overall = buildHeatmap({ historyPractices: data.history_practices || [], entries: data.entries || {}, today, days: 70 });
  // Группировка по неделям для большой сетки (Пн = 0)
  const firstDow = (parseYmd(overall[0].date).getDay() + 6) % 7;
  const padded = Array(firstDow).fill(null).concat(overall);
  const cols = Math.ceil(padded.length / 7);

  return (
    <div className="fade-in pt-6">
      <header className="mb-6">
        <p className="text-xs uppercase tracking-widest opacity-50 mb-1">История</p>
        <h1 className="font-display text-4xl font-light leading-tight">Мои <em style={{color:'#d4a857'}}>дни</em></h1>
        <p className="opacity-60 text-sm mt-2">Последние 70 дней. Цвет — доля выполненных практик.</p>
      </header>

      <div className="card rounded-2xl p-4 mb-5 overflow-x-auto scrollbar-hide">
        <div className="flex gap-1">
          {Array.from({length: cols}).map((_, c) => (
            <div key={c} className="flex flex-col gap-1">
              {Array.from({length: 7}).map((_, r) => {
                const cell = padded[c*7 + r];
                if (!cell) return <div key={r} className="heat-cell" style={{background:'transparent'}}/>;
                return (
                  <div key={r} className="heat-cell" title={`${cell.date}: ${cell.doneCount}/${cell.activeCount}`}
                       style={{background: heatColor(cell.ratio), outline: cell.today ? '1.5px solid #d4a857' : 'none'}}/>
                );
              })}
            </div>
          ))}
        </div>
        <div className="flex items-center gap-2 mt-3 text-[11px] opacity-50">
          <span>меньше</span>
          {[null, 0, 0.3, 0.6, 1].map((r,i) => (
            <span key={i} className="heat-cell" style={{background: heatColor(r)}}/>
          ))}
          <span>больше</span>
        </div>
      </div>

      {(data.history_practices || []).length === 0 ? (
        <p className="opacity-50 text-center py-8 text-sm">Истории ещё нет — присоединись к практикам и отмечай дни.</p>
      ) : (
        <div className="space-y-2">
          <p className="text-xs uppercase tracking-wider opacity-50 mb-1">По практикам</p>
          {(data.history_practices || []).map((p) => {
            const strip = buildHeatmap({ historyPractices: [p], entries: data.entries || {}, today, days: 30, practiceId: p.id });
            const accent = PALETTE[p.palette] || PALETTE.amber;
            return (
              <button key={p.id} onClick={() => onPracticeTap(p)}
                      className="card rounded-xl p-3 w-full text-left flex items-center gap-3 transition-transform active:scale-[0.99]">
                <div className="w-10 h-10 rounded-lg flex items-center justify-center text-xl flex-shrink-0 overflow-hidden"

                  {p.photo ? <img src={p.photo} alt="" className="w-full h-full object-cover"/> : p.icon}
                </div>

                    {strip.map((s) => (
                      <div key={s.date} className="heat-cell" style={{

                      }}/>
                    ))}

                </div>

            );

}

// ─── Шторка деталей практики ───
// Безопасный рендер markdown в описаниях. Контент идёт от админа — XSS-вектор низкий,
// но всё равно пропускаем через marked с дефолтным escape; raw HTML не разрешаем.
const renderMarkdown = (text) => {
  if (!text) return '';
  try {
    if (typeof marked !== 'undefined') {
      return marked.parse(String(text), { breaks: true, gfm: true });
    }
  } catch (e) { /* fallback ниже */ }
  // Если marked не загрузился — экранируем и сохраняем переводы строк.
  const esc = String(text).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  return esc.replace(/\n/g, '<br>');
};
const Markdown = ({ text, className = '' }) =>
  text ? <div className={`md-body ${className}`} dangerouslySetInnerHTML={{__html: renderMarkdown(text)}}/> : null;

function AudioSequence({ audios }) {
  // Проигрывает список аудио по очереди. Первое стартует автоматически при монтировании
  // (если браузер позволяет — открытие шторки = тап юзера, обычно разрешает).
  const [idx, setIdx] = useState(0);
  const audioRef = useRef(null);
  useEffect(() => {
    const el = audioRef.current;
    if (!el) return;
    el.play().catch(() => { /* автоплей мог быть заблокирован — пусть юзер нажмёт сам */ });
  }, [idx]);
  if (!audios || audios.length === 0) return null;
  const cur = audios[idx];
  return (
    <div className="mb-4 p-3 rounded-xl" style={{background:'rgba(212,168,87,0.06)', border:'1px solid rgba(212,168,87,0.2)'}}>
      <div className="flex items-center justify-between mb-1.5 text-xs">
        <span className="opacity-70 truncate flex-1 mr-2">
          {cur.label || `Аудио ${idx + 1}`}
        </span>
        <span className="opacity-50 whitespace-nowrap">{idx + 1} / {audios.length}</span>
      </div>
      <audio ref={audioRef} src={cur.url} controls preload="auto"
             className="w-full" style={{height:'36px'}}
             onEnded={() => { if (idx + 1 < audios.length) setIdx(idx + 1); }}/>
      {audios.length > 1 && (
        <div className="flex gap-1 mt-2">
          {audios.map((a, i) => (
            <button key={i} onClick={() => setIdx(i)}
                    className="flex-1 py-1 rounded-md text-[10px] transition"
                    style={i === idx
                      ? {background:'rgba(212,168,87,0.25)', color:'#d4a857'}
                      : {background:'rgba(244,234,213,0.04)', color:'rgba(244,234,213,0.5)'}}>
              {i + 1}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}
