                            border: todayDone ? '1px solid rgba(212,168,87,0.4)' : 'none'}}>
              {todayDone ? '✓ Пройдено · ещё раз' : '▶ Начать раунды'}
            </button>
          )}
          {practice.type === 'timer' && (
            <button onClick={() => setTimerOpen(true)}
                    className="w-full py-3.5 rounded-full font-medium text-base"
                    style={{background: todayDone ? 'rgba(212,168,87,0.15)' : `linear-gradient(135deg, ${accent}, #b8902f)`,
                            color: todayDone ? '#d4a857' : '#1a1410',
                            border: todayDone ? '1px solid rgba(212,168,87,0.4)' : 'none'}}>
              {todayDone ? `✓ ${todayEntry?.count || 0}с · ещё` : (todayEntry?.count ? `▶ Продолжить (${todayEntry.count}с)` : '▶ Запустить таймер')}
            </button>
          )}
          {practice.type === 'binary' && (
            <button onClick={markBinary} disabled={busy}
                    className="w-full py-3.5 rounded-full font-medium text-base"
                    style={{background: todayDone ? 'rgba(212,168,87,0.15)' : `linear-gradient(135deg, ${accent}, #b8902f)`,
                            color: todayDone ? '#d4a857' : '#1a1410',
                            border: todayDone ? '1px solid rgba(212,168,87,0.4)' : 'none'}}>
              {todayDone ? '✓ Сделано · отменить' : '✓ Отметить сделанным'}
            </button>
          )}
          {practice.type === 'count' && (
            <div>
              <div className="flex items-center justify-center gap-4 mb-2">
                <button onClick={() => incCount(-1)} disabled={busy || (todayEntry?.count || 0) === 0}
                        className="w-12 h-12 rounded-full flex items-center justify-center disabled:opacity-30"
                        style={{background:'rgba(244,234,213,0.06)'}}><Minus size={20}/></button>
                <div className="font-display text-4xl text-center" style={{color: todayDone ? '#d4a857' : '#f4ead5'}}>
                  {todayEntry?.count || 0}<span className="text-lg opacity-50">/{practice.target}</span>
                </div>
                <button onClick={() => incCount(1)} disabled={busy}
                        className="w-12 h-12 rounded-full flex items-center justify-center"
                        style={{background: todayDone ? `linear-gradient(135deg, ${accent}, #b8902f)` : 'rgba(244,234,213,0.08)',
                                color: todayDone ? '#1a1410' : '#f4ead5'}}><Plus size={20} sw={2.5}/></button>
              </div>
              {practice.unit && <p className="text-xs opacity-60 text-center">{practice.unit}</p>}
            </div>
          )}
          {(isResponseType || (hasExtras && !(practice.type === 'rounds' || practice.type === 'timer'))) && (
            <button onClick={() => setResponseOpen(true)}
                    className="w-full py-3.5 rounded-full font-medium text-base"
                    style={{background: todayDone ? 'rgba(212,168,87,0.15)' : `linear-gradient(135deg, ${accent}, #b8902f)`,
                            color: todayDone ? '#d4a857' : '#1a1410',
                            border: todayDone ? '1px solid rgba(212,168,87,0.4)' : 'none'}}>
              {todayDone ? '✓ Ответ есть · изменить' : '✍ Заполнить ответ'}
            </button>
          )}
          {(practice.type === 'rounds' || practice.type === 'timer') && hasExtras && (
            <button onClick={() => setResponseOpen(true)}
                    className="w-full mt-2 py-2.5 rounded-full text-sm"
                    style={{background:'rgba(244,234,213,0.05)', border:'1px solid rgba(244,234,213,0.15)', color:'#f4ead5'}}>
              ✍ Добавить ответ {todayDone ? '· изменить' : ''}
            </button>
          )}
        </div>

        {periodEnd !== undefined && (
          <div className="text-xs opacity-60 mb-4">
            {practice.period_end === null ? 'Без срока окончания' :
              daysLeft > 0 ? `Подписка до ${fmtDate(periodEnd)} · осталось ${daysLeft} ${dayN(daysLeft)}` :
                `Подписка истекла ${fmtDate(periodEnd)}`}
          </div>
        )}

        <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Последние 70 дней · нажми чтобы изменить</p>
        <div className="card rounded-xl p-3 mb-5 overflow-x-auto scrollbar-hide">
          <div className="flex gap-1">
            {Array.from({length: cols}).map((_, c) => (
              <div key={c} className="flex flex-col gap-1">
                {Array.from({length: 7}).map((_, r) => {
                  const cell = padded[c*7 + r];
                  if (!cell) return <div key={r} className="heat-cell" style={{background:'transparent'}}/>;
                  const inactive = cell.neutral;
                  return (
                    <button key={r} disabled={inactive}
                            onClick={() => onDateTap(cell.date)}
                            title={`${cell.date}: ${cell.doneCount}/${cell.activeCount}`}
                            className="heat-cell"
                            style={{background: heatColor(cell.ratio), outline: cell.today ? '1.5px solid #d4a857' : 'none', cursor: inactive ? 'default' : 'pointer', opacity: inactive ? 0.4 : 1}}/>
                  );
                })}
              </div>
            ))}
          </div>
        </div>

        {practice.period_end !== undefined && daysLeft !== null && daysLeft <= 7 && (
          <div className="grid grid-cols-2 gap-2 mb-3">
            <button disabled={busy} onClick={() => extend('week')}
                    className="py-3 rounded-xl text-sm" style={{background:'rgba(212,168,87,0.10)', border:'1px solid rgba(212,168,87,0.3)', color:'#d4a857'}}>
              + неделя
            </button>
            <button disabled={busy} onClick={() => extend('month')}
                    className="py-3 rounded-xl text-sm font-medium" style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
              + месяц
            </button>
          </div>
        )}

        <button disabled={busy} onClick={leave}
                className="w-full py-3 rounded-xl text-sm flex items-center justify-center gap-2"
                style={{border:'1px solid rgba(232,128,128,0.3)', color:'#e88080'}}>
          <Logout size={14}/> Выйти из практики
        </button>
      </div>
      {roundsOpen && (
        <RoundsRunner practice={practice} done={todayDone}
          onClose={() => { setRoundsOpen(false); if (hasExtras) setResponseOpen(true); }}
          onFinished={async () => {
            try { await api('/api/my/entry', { method:'POST', body: JSON.stringify({
              practice_id: practice.id, completed: true }) }); } catch (e) { alert(e.message); }
            await onChange();
          }}/>
      )}
      {timerOpen && (
        <TimerRunner practice={practice} entry={todayEntry}
          onClose={() => { setTimerOpen(false); if (hasExtras) setResponseOpen(true); }}
          onSaved={async (seconds) => {
            try { await api('/api/my/entry', { method:'POST', body: JSON.stringify({
              practice_id: practice.id, count: seconds }) }); } catch (e) { alert(e.message); }
            await onChange();
          }}/>
      )}
      {responseOpen && (
        <ResponseSheet practice={practice} entry={todayEntry}
          onClose={() => setResponseOpen(false)}
          onSaved={async () => { setResponseOpen(false); await onChange(); }}/>
      )}
    </div>
  );
}

// ─── Шторка отметки на конкретный день ───
function DateEntrySheet({ practice, date, currentEntry, onClose, onSaved }) {
  const [busy, setBusy] = useState(false);
  const isResponseType = practice.type === 'text' || practice.type === 'photo' || practice.type === 'video';
  const extras = practice.extras || [];

  // Прошлые дни для response-типов заморожены полностью (read-only).
  // Для binary/count primary прошлые дни можно править (включая extras).
  const readOnly = isResponseType;

  const showBinary = practice.type === 'binary';
  const showCount  = practice.type === 'count';
  const showText   = practice.type === 'text'  || extras.includes('text');
  const showPhoto  = practice.type === 'photo' || extras.includes('photo');
  const showVideo  = practice.type === 'video' || extras.includes('video');

  const [completed, setCompleted] = useState(!!currentEntry?.completed);
  const [count,     setCount]     = useState(currentEntry?.count ?? 0);
  const [text,      setText]      = useState(currentEntry?.response_text || '');
  const [photo,     setPhoto]     = useState(currentEntry?.response_photo || null);
  const [videoUrl,  setVideoUrl]  = useState(currentEntry?.response_video_url || '');

  const handlePhoto = async (file) => {
    if (!file) return;
    try { setPhoto(await compress(file)); }
    catch (e) { alert('Не получилось обработать фото'); }
  };

  const save = async () => {
    setBusy(true);
    try {
      const body = { practice_id: practice.id, date };
      if (showBinary) body.completed = completed;
      if (showCount)  body.count = Math.max(0, parseInt(count) || 0);
      if (showText)   body.response_text = text;
      if (showPhoto)  body.response_photo = photo || '';
      if (showVideo)  body.response_video_url = videoUrl;
      await api('/api/my/entry', { method:'POST', body: JSON.stringify(body) });
      await onSaved();
    } catch (e) { alert(e.message); setBusy(false); }
  };

  return (
    <div className="fixed inset-0 z-[60] flex items-end justify-center" style={{background:'rgba(0,0,0,0.6)'}} onClick={onClose}>
      <div className="w-full max-w-md rounded-t-3xl p-6 fade-in overflow-y-auto" style={{background:'#1a1d2a', maxHeight:'92vh'}} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-between items-start mb-4">
          <div>
            <p className="text-xs uppercase tracking-wider opacity-50">{practice.name}</p>
            <h2 className="font-display text-2xl mt-1">{fmtDate(date)}</h2>
          </div>
          <button onClick={onClose} className="opacity-60"><X size={20}/></button>
        </div>

        {readOnly ? (
          // Read-only: показать всё, что было записано
          <div className="space-y-3 mb-4">
            {showBinary && (
              <div className="text-sm">{currentEntry?.completed ? '✓ Сделано' : '— Не сделано'}</div>
            )}
            {showCount && (
              <div className="text-sm">{currentEntry?.count || 0}{practice.unit ? ' '+practice.unit : ''} / {practice.target || 1}</div>
            )}
            {showText && ((currentEntry?.response_text || '').trim()
              ? <div>
                  <p className="text-xs uppercase tracking-wider opacity-50 mb-1">Текст</p>
                  <p className="text-sm whitespace-pre-wrap p-3 rounded-xl"
                    style={{background:'rgba(244,234,213,0.04)', border:'1px solid rgba(244,234,213,0.08)'}}>
                    {currentEntry.response_text}
                  </p>
                </div>
              : null)}
            {showPhoto && (currentEntry?.response_photo
              ? <div>
                  <p className="text-xs uppercase tracking-wider opacity-50 mb-1">Фото</p>
                  <a href={currentEntry.response_photo} target="_blank" rel="noopener"
                     className="block rounded-xl overflow-hidden" style={{border:'1px solid rgba(244,234,213,0.1)'}}>
                    <img src={currentEntry.response_photo} className="w-full max-h-[55vh] object-contain" style={{background:'#0a0c14'}}/>
                  </a>
                </div>
              : null)}
            {showVideo && ((currentEntry?.response_video_url || '').trim()
              ? <div>
                  <p className="text-xs uppercase tracking-wider opacity-50 mb-1">Видео</p>
                  <a href={currentEntry.response_video_url} target="_blank" rel="noopener"
                     className="block p-3 rounded-xl text-sm break-all underline"
                     style={{background:'rgba(244,234,213,0.04)', border:'1px solid rgba(244,234,213,0.08)', color:'#d4a857'}}>
                    {currentEntry.response_video_url}
                  </a>
                </div>
              : null)}
            {!currentEntry && (
              <p className="text-sm opacity-50 text-center py-6">Записи за этот день нет.</p>
            )}
            <p className="text-[11px] opacity-50 text-center mt-3">Прошлые дни заморожены — изменить нельзя.</p>
          </div>
        ) : (
          // Editable: binary/count primary, можно править всё включая extras
          <div className="space-y-4 mb-4">
            {showBinary && (
              <div>
                <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Факт</p>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => setCompleted(false)} className="py-3 rounded-xl text-sm"
                    style={{background: !completed ? 'rgba(244,234,213,0.06)' : 'rgba(244,234,213,0.02)',
                            border: `1px solid ${!completed ? 'rgba(244,234,213,0.25)' : 'rgba(244,234,213,0.08)'}`}}>
                    Не сделано
                  </button>
                  <button onClick={() => setCompleted(true)} className="py-3 rounded-xl text-sm font-medium"
                    style={{background: completed ? 'linear-gradient(135deg, #d4a857, #b8902f)' : 'rgba(244,234,213,0.04)',
                            color: completed ? '#1a1410' : '#f4ead5',
                            border: completed ? 'none' : '1px solid rgba(244,234,213,0.1)'}}>
                    Сделано ✓
                  </button>
                </div>
              </div>
            )}
            {showCount && (
              <div>
                <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Сколько · цель {practice.target}{practice.unit ? ' '+practice.unit : ''}</p>
                <input type="number" inputMode="numeric" min="0" value={count}
                  onChange={(e) => setCount(e.target.value)}
                  className="input-field w-full px-4 py-3 rounded-xl font-display text-2xl text-center"/>
              </div>
            )}
            {showText && (
              <div>
                <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Текст (по желанию)</p>
                <textarea value={text} onChange={(e) => setText(e.target.value)} rows={4}
                  className="input-field w-full px-4 py-3 rounded-xl resize-none"/>
              </div>
            )}
            {showPhoto && (
              <div>
                <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Фото (по желанию)</p>
                {photo ? (
                  <div className="relative rounded-xl overflow-hidden" style={{border:'1px solid rgba(244,234,213,0.1)'}}>
                    <img src={photo} className="w-full max-h-72 object-contain" style={{background:'#0a0c14'}}/>
                    <button onClick={() => setPhoto(null)} className="absolute top-2 right-2 w-8 h-8 rounded-full"
                      style={{background:'rgba(10,12,20,0.7)'}}>×</button>
                  </div>
                ) : (
                  <label className="block p-5 rounded-xl text-center text-sm opacity-70 cursor-pointer"
                    style={{border:'1px dashed rgba(244,234,213,0.2)'}}>
                    Загрузить фото
                    <input type="file" accept="image/*" className="hidden"
                      onChange={(e) => handlePhoto(e.target.files?.[0])}/>
                  </label>
                )}
              </div>
            )}
            {showVideo && (
              <div>
                <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Ссылка на видео (по желанию)</p>
                <input type="url" value={videoUrl} onChange={(e) => setVideoUrl(e.target.value)}
                  placeholder="https://..." className="input-field w-full px-4 py-3 rounded-xl"/>
              </div>
            )}
          </div>
        )}

        {!readOnly ? (
          <button onClick={save} disabled={busy}
                  className="w-full py-3.5 rounded-full font-medium disabled:opacity-50"
                  style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
            {busy ? 'Сохраняем...' : 'Сохранить'}
          </button>
        ) : (
          <button onClick={onClose}
                  className="w-full py-3.5 rounded-full"
                  style={{border:'1px solid rgba(244,234,213,0.15)'}}>
            Закрыть
          </button>
        )}
      </div>
    </div>
  );
}

  'Europe/Moscow', 'Europe/Kaliningrad', 'Europe/Samara',
  'Asia/Yekaterinburg', 'Asia/Omsk', 'Asia/Krasnoyarsk',
  'Asia/Irkutsk', 'Asia/Yakutsk', 'Asia/Vladivostok', 'Asia/Magadan', 'Asia/Kamchatka',
  'Europe/Kyiv', 'Europe/Minsk', 'Asia/Tbilisi', 'Asia/Yerevan', 'Asia/Baku',
  'Asia/Almaty', 'Asia/Tashkent', 'Asia/Bishkek', 'Asia/Dushanbe',
  'Europe/Berlin', 'Europe/London', 'Europe/Paris', 'Europe/Istanbul',
  'America/New_York', 'America/Chicago', 'America/Los_Angeles',
  'Asia/Tokyo', 'Asia/Shanghai', 'UTC',
];

function SettingsSheet({ me, onClose, onChanged }) {
  const [tz, setTz] = useState(me?.tz || 'Europe/Moscow');
  const [busy, setBusy] = useState(false);

  const tzOptions = Array.from(new Set([userTz, me?.tz, ...COMMON_TZ].filter(Boolean)));

  const save = async () => {
    setBusy(true);
    try { await api('/api/me/settings', { method:'PUT', body: JSON.stringify({ tz }) }); await onChanged(); onClose(); }
    catch (e) { alert(e.message); setBusy(false); }
  };

  const unmute = async () => {
    setBusy(true);
    try { await api('/api/me/settings', { method:'PUT', body: JSON.stringify({ mute_until: 0 }) }); await onChanged(); setBusy(false); }
    catch (e) { alert(e.message); setBusy(false); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{background:'rgba(0,0,0,0.6)'}} onClick={onClose}>
      <div className="w-full max-w-md rounded-t-3xl p-6 fade-in" style={{background:'#161824', maxHeight:'92vh', overflowY:'auto'}} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-between items-start mb-5">
          <h2 className="font-display text-2xl">Настройки</h2>
          <button onClick={onClose} className="opacity-60"><X size={20}/></button>
        </div>

        <p className="text-xs uppercase tracking-wider opacity-50 mb-2">Часовой пояс</p>
        <select value={tz} onChange={(e) => setTz(e.target.value)}
                className="input-field w-full px-4 py-3 rounded-xl mb-1">
          {tzOptions.map((z) => <option key={z} value={z} style={{background:'#161824'}}>{z}</option>)}
        </select>
        <p className="text-[11px] opacity-50 mb-5">Браузер думает: {userTz || '—'}</p>

        {me?.muted && (
          <div className="card rounded-xl p-4 mb-4 flex items-center gap-3" style={{borderColor:'rgba(127,179,211,0.3)'}}>
            <Pause size={18} style={{color:'#b8d3e6'}}/>
            <div className="flex-1 text-sm">
              <div>Напоминания на паузе до завтра</div>
              <div className="text-xs opacity-60">Стрики и подписки сохранены</div>
            </div>
            <button disabled={busy} onClick={unmute}
                    className="px-3 py-1.5 rounded-full text-xs"
                    style={{background:'rgba(127,179,211,0.15)', color:'#b8d3e6', border:'1px solid rgba(127,179,211,0.3)'}}>
              Снять
            </button>
          </div>
        )}

        <button onClick={save} disabled={busy}
                className="w-full py-3.5 rounded-full font-medium disabled:opacity-50 mb-3"
                style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
          {busy ? 'Сохраняем...' : 'Сохранить'}
        </button>

        {me?.auth_method === 'web' && (
          <button onClick={async () => {
                    try { await api('/api/auth/logout', { method:'POST' }); }
                    finally { window.location.replace('/login'); }
                  }}
                  className="w-full py-3 rounded-full text-sm flex items-center justify-center gap-2 mb-2"
                  style={{border:'1px solid rgba(232,128,128,0.3)', color:'#e88080'}}>
            <Logout size={14}/> Выйти из аккаунта
          </button>
        )}

        <p className="text-[11px] opacity-40 text-center">
          Чтобы выйти из всех практик — {me?.auth_method === 'telegram' ? 'отправь боту команду /leave_all' : 'отпишись от каждой через её карточку'}
        </p>
      </div>
    </div>
  );
}

// ─── Рейтинг ───

          <div className="card rounded-2xl p-4 mt-4 flex items-center gap-3" style={{borderColor:'rgba(212,168,87,0.3)'}}>

            <div className="flex-1">

            </div>
            <Trophy size={28} style={{color:'#d4a857'}}/>
          </div>
        )}
      </header>
      <div className="flex gap-2 mb-4">
        {[['week','Неделя'],['month','Месяц'],['all','Всё время']].map(([v,l]) => (
          <button key={v} onClick={() => { setPeriod(v); onPeriod(v); }}
            className="px-4 py-1.5 rounded-full text-sm"
            style={{
              background: period === v ? 'rgba(212,168,87,0.15)' : 'rgba(244,234,213,0.04)',
              color: period === v ? '#d4a857' : '#f4ead5',
              border: `1px solid ${period === v ? 'rgba(212,168,87,0.3)' : 'rgba(244,234,213,0.08)'}`,
            }}>{l}</button>
        ))}
      </div>
      {board.length === 0 ? (
        <p className="opacity-50 text-center py-12 text-sm">Пока никто не отметил ни одной практики.</p>
      ) : (
        <div className="space-y-2">
          {board.slice(0, 50).map((r) => (
            <div key={r.user_id} className={`card rounded-xl p-3 flex items-center gap-3 ${r.user_id === me?.id ? 'card-done' : ''}`}>
              <div className="w-10 text-center font-display text-2xl" style={{color: r.rank <= 3 ? '#d4a857' : '#f4ead5'}}>
                {r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : `#${r.rank}`}
              </div>
              <div className="flex-1 min-w-0">
                <div className="font-medium truncate">{r.name}</div>
                <div className="text-xs opacity-50">{r.done} из {r.plan} дней</div>
              </div>
              <div className="font-display text-xl" style={{color: r.pct >= 80 ? '#d4a857' : '#f4ead5'}}>{r.pct}%</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TabBar({ tab, setTab, isAdmin }) {

    { id: 'today', label: 'Сегодня', icon: Check },
    { id: 'catalog', label: 'Каталог', icon: Plus },
    { id: 'history', label: 'История', icon: HistoryIcon },

  ];
  return (
    <nav className="fixed bottom-0 left-0 right-0 z-40 backdrop-blur-md" style={{background:'rgba(13, 16, 24, 0.85)', borderTop:'1px solid rgba(244,234,213,0.08)', paddingBottom: 'env(safe-area-inset-bottom)'}}>
      <div className="max-w-md mx-auto flex">
        {items.map((it) => (
          <button key={it.id} onClick={() => setTab(it.id)}
            className={`flex-1 py-3 flex flex-col items-center gap-0.5 transition-colors ${tab === it.id ? 'tab-active' : 'opacity-50'}`}>
            <it.icon size={20}/>
            <span className="text-[11px]">{it.label}</span>
          </button>
        ))}
        {isAdmin && (
          <a href="/admin" className="flex-1 py-3 flex flex-col items-center gap-0.5 opacity-50">
            <Sparkles size={20}/>
            <span className="text-[11px]">Админ</span>
          </a>
        )}
      </div>
    </nav>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
