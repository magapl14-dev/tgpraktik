<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Вход · Мои практики</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0c14">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Практики">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { background: #0a0c14; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; color: #f4ead5; font-family: 'Manrope', system-ui, sans-serif; }
  .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
  .app-bg {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(212,168,87,0.10), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(127,179,211,0.06), transparent 50%),
      linear-gradient(180deg, #0d1018 0%, #0a0c14 100%);
    min-height: 100vh; min-height: 100dvh;
  }
  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="app-bg">
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm fade-in text-center">
    <header class="mb-10">
      <h1 class="font-display text-5xl font-light leading-tight">Мои <em style="color:#d4a857">практики</em></h1>
      <p class="opacity-60 text-sm mt-3">Вход через Telegram</p>
    </header>

    <div id="loading" class="opacity-60 font-display text-lg">проверяем сессию...</div>
    <div id="widget-host" class="hidden flex justify-center min-h-[44px]"></div>
    <div id="error" class="hidden mt-4 px-3 py-2 rounded-xl text-sm"
         style="background:rgba(232,128,128,0.10); border:1px solid rgba(232,128,128,0.3); color:#e88080"></div>

    <p id="hint" class="hidden text-xs opacity-50 mt-8 leading-relaxed">
      Кнопка откроет Telegram, попросит подтвердить вход — и вернёт сюда.
      Один аккаунт работает и в боте, и в браузере.
    </p>
  </div>
</div>

<script>
// PWA: регистрируем SW для оффлайн-фоллбека
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

const $ = (id) => document.getElementById(id);
const showError = (msg) => {
  $('error').textContent = msg;
  $('error').classList.remove('hidden');
  $('loading').classList.add('hidden');
};

const api = async (path, opts = {}) => {
  const r = await fetch(path, {
    ...opts,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
  return data;
};

// Куда вернуть после успешного входа.
// Принимаем только same-origin путь, начинающийся с '/' (без '//' — защита от open redirect).
// Дефолт — '/app'.
const getReturnTo = () => {
  try {
    const raw = new URLSearchParams(location.search).get('return_to');
    if (raw && raw.startsWith('/') && !raw.startsWith('//')) return raw;
  } catch (e) {}
  return '/app';
};
const RETURN_TO = getReturnTo();

// Callback из Telegram Login Widget
window.onTelegramAuth = async (user) => {
  $('loading').textContent = 'входим...';
  $('loading').classList.remove('hidden');
  $('widget-host').classList.add('hidden');
  $('error').classList.add('hidden');
  try {
    await api('/api/auth/telegram', {
      method: 'POST',
      body: JSON.stringify(user),
      headers: { 'X-User-TZ': (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) { return ''; } })() },
    });
    window.location.replace(RETURN_TO);
  } catch (e) {
    showError(e.message);
    $('widget-host').classList.remove('hidden');
  }
};

(async () => {
  // Если уже залогинен — сразу на return_to (по умолчанию /app)
  try {
    await api('/api/me');
    window.location.replace(RETURN_TO);
    return;
  } catch (e) {
    // не залогинен — продолжаем
  }

  // Получаем имя бота
  let cfg;
  try {
    cfg = await api('/api/auth/config');
  } catch (e) {
    showError('Не удалось получить конфиг сервера: ' + e.message);
    return;
  }
  if (!cfg.bot_username) {
    showError('У бота не задан username — TG Login Widget не работает. Проверь, что BOT_TOKEN настроен и в @BotFather у бота установлен @username.');
    return;
  }

  // Рендерим виджет
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://telegram.org/js/telegram-widget.js?22';
  s.setAttribute('data-telegram-login', cfg.bot_username);
  s.setAttribute('data-size', 'large');
  s.setAttribute('data-radius', '16');
  s.setAttribute('data-onauth', 'onTelegramAuth(user)');
  s.setAttribute('data-request-access', 'write');
  $('widget-host').appendChild(s);

  $('loading').classList.add('hidden');
  $('widget-host').classList.remove('hidden');
  $('hint').classList.remove('hidden');
})();
</script>
</body>
</html>
