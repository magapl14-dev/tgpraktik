<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Вход · Мои практики</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { background: #0a0c14; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; color: #f4ead5; font-family: 'Manrope', system-ui, sans-serif; }
  .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
  .app-bg {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(212,168,87,0.10), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(127,179,211,0.06), transparent 50%),
      linear-gradient(180deg, #0d1018 0%, #0a0c14 100%);
    min-height: 100vh; min-height: 100dvh;
  }
  .input-field { background: rgba(255,250,235,0.04); border: 1px solid rgba(244,234,213,0.12);
                 color: #f4ead5; transition: all 0.2s; }
  .input-field:focus { outline: none; border-color: rgba(212,168,87,0.5); }
  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="app-bg">
<div id="root" class="min-h-screen flex items-center justify-center p-4">
  <div class="opacity-60 font-display text-xl">загружаем...</div>
</div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const api = async (path, opts = {}) => {
  const r = await fetch(path, {
    ...opts,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
  return data;
};

function App() {
  const [mode, setMode] = useState('login'); // 'login' | 'register'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [checking, setChecking] = useState(true);

  // Если уже залогинен — редирект на /app
  useEffect(() => {
    (async () => {
      try {
        await api('/api/me');
        window.location.replace('/app');
      } catch (e) {
        setChecking(false);
      }
    })();
  }, []);

  const submit = async (e) => {
    e.preventDefault();
    setErr(''); setBusy(true);
    try {
      const path = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
      const body = mode === 'login' ? { email, password } : { email, password, name: name.trim() || null };
      await api(path, { method: 'POST', body: JSON.stringify(body) });
      window.location.replace('/app');
    } catch (e) {
      setErr(e.message);
      setBusy(false);
    }
  };

  if (checking) {
    return <div className="opacity-60 font-display text-xl">проверяем сессию...</div>;
  }

  return (
    <div className="w-full max-w-sm fade-in">
      <header className="text-center mb-8">
        <h1 className="font-display text-5xl font-light leading-tight">Мои <em style={{color:'#d4a857'}}>практики</em></h1>
        <p className="opacity-60 text-sm mt-2">Вход без Telegram</p>
      </header>

      <div className="flex gap-2 mb-5 bg-white/5 rounded-full p-1">
        {[['login','Войти'],['register','Регистрация']].map(([v,l]) => (
          <button key={v} onClick={() => { setMode(v); setErr(''); }}
            className="flex-1 py-2 rounded-full text-sm transition-all"
            style={{
              background: mode === v ? 'rgba(212,168,87,0.15)' : 'transparent',
              color: mode === v ? '#d4a857' : '#f4ead5',
              border: `1px solid ${mode === v ? 'rgba(212,168,87,0.4)' : 'transparent'}`,
            }}>{l}</button>
        ))}
      </div>

      <form onSubmit={submit} className="space-y-3">
        {mode === 'register' && (
          <input type="text" value={name} onChange={(e) => setName(e.target.value)}
                 placeholder="Имя (необязательно)"
                 className="input-field w-full px-4 py-3 rounded-xl"/>
        )}
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
               placeholder="Email" autoComplete="email" required
               className="input-field w-full px-4 py-3 rounded-xl"/>
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
               placeholder={mode === 'register' ? 'Пароль (минимум 8 символов)' : 'Пароль'}
               autoComplete={mode === 'login' ? 'current-password' : 'new-password'}
               minLength={mode === 'register' ? 8 : 1}
               required
               className="input-field w-full px-4 py-3 rounded-xl"/>

        {err && (
          <div className="px-3 py-2 rounded-xl text-sm"
               style={{background:'rgba(232,128,128,0.10)', border:'1px solid rgba(232,128,128,0.3)', color:'#e88080'}}>
            {err}
          </div>
        )}

        <button type="submit" disabled={busy}
          className="w-full py-3.5 rounded-full font-medium transition-transform active:scale-[0.99] disabled:opacity-50"
          style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
          {busy ? '...' : (mode === 'login' ? 'Войти' : 'Создать аккаунт')}
        </button>
      </form>

      <p className="text-[11px] opacity-40 text-center mt-6">
        У тебя есть Telegram? Открой бота и используй кнопку «Практики» — стрики и подписки оттуда отдельные от веб-аккаунта.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
