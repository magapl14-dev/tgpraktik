<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Админка · Практики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { background: #0a0c14; }
  body { margin: 0; color: #f4ead5; font-family: 'Manrope', system-ui, sans-serif; }
  .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
  .app-bg { background: linear-gradient(180deg, #0d1018, #0a0c14); min-height: 100vh; min-height: 100dvh; }
  .card { background: rgba(255,250,235,0.04); border: 1px solid rgba(244,234,213,0.08); }
  .input-field { background: rgba(255,250,235,0.04); border: 1px solid rgba(244,234,213,0.12); color: #f4ead5; transition: all 0.2s; }
  .input-field:focus { outline: none; border-color: rgba(212,168,87,0.5); }
  .md-body { font-size: 13px; line-height: 1.5; color: rgba(244,234,213,0.88); }
  .md-body > *:first-child { margin-top: 0; } .md-body > *:last-child { margin-bottom: 0; }
  .md-body p { margin: 0.5em 0; }
  .md-body h1, .md-body h2, .md-body h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; margin: 0.8em 0 0.3em; color: #f4ead5; }
  .md-body h1 { font-size: 1.35em; } .md-body h2 { font-size: 1.2em; } .md-body h3 { font-size: 1.05em; }
  .md-body strong { color: #f4ead5; font-weight: 600; }
  .md-body ul, .md-body ol { margin: 0.4em 0; padding-left: 1.25em; }
  .md-body li { margin: 0.15em 0; }
  .md-body ul li::marker, .md-body ol li::marker { color: #d4a857; }
  .md-body blockquote { margin: 0.5em 0; padding: 0.25em 0.7em; border-left: 3px solid rgba(212,168,87,0.45); background: rgba(212,168,87,0.05); border-radius: 0 6px 6px 0; }
  .md-body code { background: rgba(244,234,213,0.08); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; font-family: ui-monospace, monospace; }
  .md-body a { color: #d4a857; text-decoration: underline; }
  select.input-field option { background: #161824; color: #f4ead5; }
  select.input-field optgroup { background: #0d1018; color: #d4a857; font-style: normal; font-weight: 600; }
  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { scrollbar-width: none; }
</style>
</head>
<body class="app-bg pb-12">
<div id="root" style="padding: 0 16px; max-width: 900px; margin: 0 auto;">
  <div style="text-align: center; padding: 60px 0; opacity: 0.6;" class="font-display text-xl">проверяем доступ...</div>
</div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const tg = window.Telegram?.WebApp;
const initData = tg?.initData || '';
const userTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) { return ''; } })();
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0a0c14'); }

const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: {
    'Content-Type': 'application/json', 'X-Init-Data': initData, 'X-User-TZ': userTz, ...(opts.headers||{}) }});
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `HTTP ${r.status}`);
  return r.json();
};

const PALETTES = [
  {n:'sage', bg:'#3d4a3a', a:'#a3b18a'}, {n:'amber', bg:'#4a3520', a:'#d4a857'},
  {n:'rose', bg:'#4a2f33', a:'#c98e95'}, {n:'azure', bg:'#22384a', a:'#7fb3d3'},
  {n:'plum', bg:'#3a2a44', a:'#b399c4'}, {n:'rust', bg:'#4a2a22', a:'#cf8770'},
  {n:'mint', bg:'#1f4040', a:'#88c4b8'}, {n:'gold', bg:'#3d3520', a:'#e0bd6a'},
];
const ICONS = ['🌙','☀️','🔥','💧','🕉️','🧘','📿','🌿','✨','🪷','📖','✍️','💪','🏃','🧠','❤️','🎯','🌅','⭐','🌊','🦋','🌸','🍃','🌟'];
const MAX_LEVEL = 4;

const compress = (file, maxDim = 700, q = 0.7) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = (e) => { const img = new Image(); img.onload = () => {
    const c = document.createElement('canvas'); let w=img.width, h=img.height;
    if (w > h && w > maxDim) { h = h*(maxDim/w); w = maxDim; }
    else if (h >= w && h > maxDim) { w = w*(maxDim/h); h = maxDim; }
    c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    res(c.toDataURL('image/jpeg', q));
  }; img.onerror = rej; img.src = e.target.result; };
  r.onerror = rej; r.readAsDataURL(file);
});

// Превращает плоский список в дерево; элементы с неизвестным parent_id попадают в корень
const buildTree = (cats) => {
  const byParent = {};
  cats.forEach(c => {
    const k = c.parent_id || 'ROOT';
    if (!byParent[k]) byParent[k] = [];
    byParent[k].push(c);
  });
  Object.values(byParent).forEach(arr => arr.sort((a,b) => (a.sort_order - b.sort_order) || a.name.localeCompare(b.name, 'ru')));
  const make = (parentKey) => (byParent[parentKey] || []).map(c => ({...c, children: make(c.id)}));
  return make('ROOT');
};

// Путь категории «Здоровье / Телесные / Активные» по плоскому списку
const categoryPath = (cats, id) => {
  const byId = Object.fromEntries(cats.map(c => [c.id, c]));
  const parts = [];
  let cur = byId[id];
  while (cur) { parts.unshift(cur.name); cur = cur.parent_id ? byId[cur.parent_id] : null; }
  return parts.join(' / ');
};

function App() {
  const [me, setMe] = useState(null);
  const [tab, setTab] = useState('practices');
  const [practices, setPractices] = useState([]);
  const [programs, setPrograms] = useState([]);
  const [categories, setCategories] = useState([]);
  const [stats, setStats] = useState(null);
  const [users, setUsers] = useState([]);
  const [editing, setEditing] = useState(null);
  const [editingProgram, setEditingProgram] = useState(null);
  const [assigningUser, setAssigningUser] = useState(null);
  const [historyUser, setHistoryUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');

  const refresh = async () => {
    const [m, p, s, cats, progs] = await Promise.all([
      api('/api/me'), api('/api/admin/practices'), api('/api/admin/stats'),
      api('/api/admin/categories'), api('/api/admin/programs')
    ]);
    setMe(m); setPractices(p); setStats(s); setCategories(cats); setPrograms(progs);
  };

  useEffect(() => {
    (async () => {
      try { await refresh(); } catch (e) { setErr(e.message); }
      setLoading(false);
    })();
  }, []);

  const loadUsers = async () => {
    try { setUsers(await api('/api/admin/users')); } catch (e) { setErr(e.message); }
  };

  if (loading) return <div className="text-center pt-20 opacity-60 font-display text-xl">загружаем...</div>;
  if (err) return (
    <div className="text-center pt-20 px-6">
      <p className="opacity-60 mb-2 font-display text-xl">Доступ закрыт</p>
      <p className="text-sm opacity-40 mb-6">{err}</p>
      <a href="/login?return_to=/admin"
         className="inline-block px-6 py-3 rounded-full font-medium"
         style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
        Войти через Telegram
      </a>
      <p className="text-xs opacity-30 mt-4 leading-relaxed">
        Откроется виджет Telegram — подтвердишь вход и вернёшься в админку.
      </p>
    </div>
  );

  if (editing !== null) {
    return <PracticeForm practice={editing} categories={categories} onClose={() => setEditing(null)} onSaved={async () => { setEditing(null); await refresh(); }}/>;
  }

  if (editingProgram !== null) {
    return <ProgramForm program={editingProgram} practices={practices}
      onClose={() => setEditingProgram(null)}
      onSaved={async () => { setEditingProgram(null); await refresh(); }}/>;
  }

  return (
    <div className="fade-in pt-6">
      <header className="mb-6 flex items-start justify-between">
        <div>
          <p className="text-xs uppercase tracking-widest opacity-50 mb-1">Админка</p>
          <h1 className="font-display text-4xl font-light leading-tight">Управление <em style={{color:'#d4a857'}}>практиками</em></h1>
        </div>
        <a href="/app" className="text-sm opacity-60 hover:opacity-100 px-3 py-1.5 rounded-full" style={{border:'1px solid rgba(244,234,213,0.15)'}}>← в приложение</a>
      </header>

      {stats && (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
          <Stat label="Пользователей" value={stats.users}/>
          <Stat label="Практик активно" value={stats.practices}/>
          <Stat label="Подписок активных" value={stats.joined}/>
          <Stat label="Отметок сегодня" value={stats.active_today}/>
        </div>
      )}

      <div className="flex gap-2 mb-4 flex-wrap">
        {[['practices','Практики'],['programs','Программы'],['motivations','Мотивашки'],['categories','Категории'],['users','Пользователи']].map(([v,l]) => (
          <button key={v} onClick={() => { setTab(v); if (v==='users' && !users.length) loadUsers(); }}
            className="px-4 py-1.5 rounded-full text-sm"
            style={{
              background: tab === v ? 'rgba(212,168,87,0.15)' : 'rgba(244,234,213,0.04)',
              color: tab === v ? '#d4a857' : '#f4ead5',
              border: `1px solid ${tab === v ? 'rgba(212,168,87,0.3)' : 'rgba(244,234,213,0.08)'}`,
            }}>{l}</button>
        ))}
      </div>

      {tab === 'practices' && <PracticesList practices={practices} categories={categories} onEdit={setEditing} onCreate={() => setEditing({})} onChange={refresh}/>}
      {tab === 'programs' && <ProgramsList programs={programs} onEdit={setEditingProgram} onCreate={() => setEditingProgram({})} onChange={refresh}/>}
      {tab === 'motivations' && <MotivationsTab practices={practices} programs={programs}/>}
      {tab === 'categories' && <CategoriesTab categories={categories} onChange={refresh}/>}
      {tab === 'users' && <UsersList users={users} onAssign={setAssigningUser} onHistory={setHistoryUser}/>}

      {assigningUser && (
        <AssignmentsModal user={assigningUser} practices={practices} programs={programs}
          onClose={() => setAssigningUser(null)}/>
      )}
      {historyUser && (
        <UserHistoryModal user={historyUser} onClose={() => setHistoryUser(null)}/>
      )}
    </div>
  );
}

const Stat = ({label, value}) => (
  <div className="card rounded-xl p-4">
    <div className="text-xs uppercase tracking-wider opacity-50">{label}</div>
    <div className="font-display text-3xl mt-1" style={{color:'#d4a857'}}>{value}</div>
  </div>
);

function PracticesList({ practices, categories, onEdit, onCreate, onChange }) {
  const remove = async (p) => {
    if (!confirm(`Удалить «${p.name}»? Все записи юзеров по этой практике сохранятся.`)) return;
    await api(`/api/admin/practices/${p.id}`, { method:'DELETE' });
    await onChange();
  };
  return (
    <div>
      <button onClick={onCreate}
        className="w-full mb-4 py-3 rounded-full font-medium flex items-center justify-center gap-2"
        style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
        <span style={{fontSize:'20px', lineHeight:0}}>+</span> Создать практику
      </button>
      {practices.length === 0 && <p className="opacity-50 text-center py-12 text-sm">Пока ни одной. Создайте первую — пользователи увидят её в каталоге.</p>}
      <div className="space-y-2">
        {practices.map((p) => {
          const palette = PALETTES.find(x => x.n === p.palette) || PALETTES[1];
          const cats = (p.category_ids || []).map(id => categoryPath(categories, id)).filter(Boolean);
          return (
            <div key={p.id} className="card rounded-xl p-3 flex items-center gap-3">
              <div className="w-12 h-12 rounded-lg flex items-center justify-center text-2xl flex-shrink-0 overflow-hidden"
                   style={{background: p.photo ? 'transparent' : palette.bg, border:`1px solid ${palette.a}33`}}>
                {p.photo ? <img src={p.photo} className="w-full h-full object-cover"/> : p.icon}
              </div>
              <div className="flex-1 min-w-0">
                <div className="font-display text-lg leading-tight truncate">{p.name}</div>
                <div className="text-xs opacity-60 flex items-center gap-2 flex-wrap">
                  <span>{
                    p.type === 'binary' ? 'Факт' :
                    p.type === 'count'  ? `Кол-во ${p.target}${p.unit ? ' '+p.unit : ''}` :
                    p.type === 'text'   ? 'Текст' :
                    p.type === 'photo'  ? 'Фото'  :
                    p.type === 'video'  ? 'Видео' :
                    p.type === 'rounds' ? `Раунды ${p.rounds_count || '?'}×${p.work_seconds || '?'}с / ${p.rest_seconds || 0}с` :
                    p.type === 'timer'  ? `Таймер до ${p.target || '?'}с` :
                    p.type
                  }</span>
                  <span>•</span>
                  <span>{p.max_reminders} напом. {p.reminder_from}–{p.reminder_to}</span>
                  {!p.active && <><span>•</span><span style={{color:'#e88080'}}>выключена</span></>}
                </div>
                {cats.length > 0 && (
                  <div className="text-[11px] opacity-50 mt-1 truncate" title={cats.join(' · ')}>
                    {cats.join(' · ')}
                  </div>
                )}
              </div>
              <button onClick={() => onEdit(p)} className="px-3 py-1.5 text-sm rounded-full"
                style={{border:'1px solid rgba(244,234,213,0.15)'}}>Изм.</button>
              <button onClick={() => remove(p)} className="px-3 py-1.5 text-sm rounded-full"
                style={{border:'1px solid rgba(232,128,128,0.3)', color:'#e88080'}}>Удалить</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Категории ───
function CategoriesTab({ categories, onChange }) {
  const tree = useMemo(() => buildTree(categories), [categories]);
  const [adding, setAdding] = useState(null); // parent_id или 'ROOT'

  const create = async (name, parent_id) => {
    name = (name || '').trim();
    if (!name) return;
    try {
      await api('/api/admin/categories', { method:'POST', body: JSON.stringify({ name, parent_id: parent_id || null, sort_order: 0 }) });
      await onChange(); setAdding(null);
    } catch (e) { alert(e.message); }
  };

  return (
    <div>
      <p className="opacity-60 text-sm mb-4">До {MAX_LEVEL} уровней. Каждая практика может относиться к нескольким категориям; видна на всех уровнях своей цепочки.</p>
      <button onClick={() => setAdding('ROOT')}
        className="w-full mb-4 py-3 rounded-full font-medium flex items-center justify-center gap-2"
        style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
        <span style={{fontSize:'20px', lineHeight:0}}>+</span> Корневая категория
      </button>
      {adding === 'ROOT' && (
        <CategoryAddInput onCancel={() => setAdding(null)} onSave={(n) => create(n, null)}/>
      )}
      {tree.length === 0 && adding !== 'ROOT' && (
        <p className="opacity-50 text-center py-12 text-sm">Категорий ещё нет. Создай корневую — например «Здоровье» или «Мужские практики».</p>
      )}
      <div className="space-y-1">
        {tree.map((node) => (
          <CategoryNode key={node.id} node={node} adding={adding} setAdding={setAdding} onChange={onChange}/>
        ))}
      </div>
    </div>
  );
}

function CategoryNode({ node, adding, setAdding, onChange }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(node.name);
  const indent = (node.level - 1) * 16;
  const canAddChild = node.level < MAX_LEVEL;

  const save = async () => {
    const n = draft.trim();
    if (!n || n === node.name) { setEditing(false); setDraft(node.name); return; }
    try {
      await api(`/api/admin/categories/${node.id}`, { method:'PUT', body: JSON.stringify({ name: n, sort_order: node.sort_order || 0 }) });
      await onChange(); setEditing(false);
    } catch (e) { alert(e.message); }
  };

  const remove = async () => {
    const childCount = countDescendants(node);
    const tail = childCount > 0 ? ` Внутри ${childCount} вложенных категорий — они тоже удалятся.` : '';
    if (!confirm(`Удалить категорию «${node.name}»?${tail}\n\nСвязи с практиками снимутся, сами практики останутся.`)) return;
    try {
      await api(`/api/admin/categories/${node.id}`, { method:'DELETE' });
      await onChange();
    } catch (e) { alert(e.message); }
  };

  const create = async (name) => {
    name = (name || '').trim();
    if (!name) return;
    try {
      await api('/api/admin/categories', { method:'POST', body: JSON.stringify({ name, parent_id: node.id, sort_order: 0 }) });
      await onChange(); setAdding(null);
    } catch (e) { alert(e.message); }
  };

  return (
    <>
      <div className="card rounded-xl px-3 py-2 flex items-center gap-2" style={{marginLeft: indent}}>
        <span className="text-xs opacity-40 font-mono">L{node.level}</span>
        {editing ? (
          <input
            autoFocus value={draft} onChange={(e) => setDraft(e.target.value)}
            onBlur={save}
            onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { setEditing(false); setDraft(node.name); } }}
            className="input-field flex-1 px-2 py-1 rounded text-sm"
          />
        ) : (
          <button onClick={() => { setDraft(node.name); setEditing(true); }} className="flex-1 text-left text-sm truncate">
            {node.name}
            {node.practice_count > 0 && <span className="opacity-50 ml-2 text-xs">· {node.practice_count} практ.</span>}
          </button>
        )}
        {canAddChild && (
          <button onClick={() => setAdding(node.id)} title="Добавить подкатегорию"
                  className="w-7 h-7 rounded-full flex items-center justify-center opacity-70 hover:opacity-100"
                  style={{background:'rgba(212,168,87,0.10)', color:'#d4a857'}}>+</button>
        )}
        <button onClick={remove} title="Удалить"
                className="w-7 h-7 rounded-full flex items-center justify-center opacity-70 hover:opacity-100"
                style={{background:'rgba(232,128,128,0.10)', color:'#e88080'}}>×</button>
      </div>
      {adding === node.id && (
        <div style={{marginLeft: indent + 16}}>
          <CategoryAddInput onCancel={() => setAdding(null)} onSave={create}/>
        </div>
      )}
      {(node.children || []).map((child) => (
        <CategoryNode key={child.id} node={child} adding={adding} setAdding={setAdding} onChange={onChange}/>
      ))}
    </>
  );
}

function countDescendants(node) {
  let n = 0;
  const walk = (x) => { (x.children || []).forEach(c => { n++; walk(c); }); };
  walk(node);
  return n;
}

function CategoryAddInput({ onCancel, onSave }) {
  const [v, setV] = useState('');
  return (
    <div className="card rounded-xl px-3 py-2 flex items-center gap-2 my-1" style={{borderColor:'rgba(212,168,87,0.4)'}}>
      <input autoFocus value={v} onChange={(e) => setV(e.target.value)}
             placeholder="Название категории"
             onKeyDown={(e) => { if (e.key === 'Enter') onSave(v); if (e.key === 'Escape') onCancel(); }}
             className="input-field flex-1 px-2 py-1 rounded text-sm"/>
      <button onClick={() => onSave(v)} className="px-3 py-1 text-xs rounded-full" style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>OK</button>
      <button onClick={onCancel} className="px-3 py-1 text-xs rounded-full opacity-60">Отмена</button>
    </div>
  );
}

function UsersList({ users, onAssign, onHistory }) {
  if (users.length === 0) return <p className="opacity-50 text-center py-12 text-sm">Загружаем...</p>;
  return (
    <div className="space-y-2">
      {users.map((u) => (
        <div key={u.user_id} className="card rounded-xl p-3 flex items-center gap-3 flex-wrap">
          <div className="w-10 h-10 rounded-full flex items-center justify-center font-medium" style={{background:'rgba(212,168,87,0.15)', color:'#d4a857'}}>
            {(u.first_name || '?')[0]}
          </div>
          <div className="flex-1 min-w-0">
            <div className="font-medium">{u.first_name || 'Без имени'} {u.username ? <span className="opacity-50 text-sm">@{u.username}</span> : null}</div>
            <div className="text-xs opacity-50">был: {new Date(u.last_seen).toLocaleString('ru-RU')}</div>
          </div>
          <div className="text-right text-xs opacity-70">
            <div>{u.active_practices} акт.</div>
            <div className="opacity-50">{u.total_entries} отметок</div>
          </div>
          <button onClick={() => onHistory(u)} className="px-3 py-1.5 text-sm rounded-full whitespace-nowrap"
            style={{border:'1px solid rgba(244,234,213,0.15)'}}>История</button>
          <button onClick={() => onAssign(u)} className="px-3 py-1.5 text-sm rounded-full whitespace-nowrap"

function ProgramForm({ program, practices, onClose, onSaved }) {
  const isNew = !program.id;
  const [v, setV] = useState({
    name: program.name || '',
    description: program.description || '',
    icon: program.icon || '🎯',
    palette: program.palette || 'amber',
    on_miss: program.on_miss || 'reset',
    visibility: program.visibility || 'public',
    active: program.active !== false,
    levels: (program.levels || []).map(l => ({
      practice_id: l.practice_id,
      duration_days: l.duration_days,
    })),
  });
  const [saving, setSaving] = useState(false);
  const set = (k, val) => setV((s) => ({...s, [k]: val}));
  const updateLevel = (i, patch) => set('levels', v.levels.map((l, j) => j === i ? {...l, ...patch} : l));
  const addLevel = () => set('levels', [...v.levels, { practice_id: practices[0]?.id || '', duration_days: 7 }]);
  const removeLevel = (i) => set('levels', v.levels.filter((_, j) => j !== i));
  const moveLevel = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= v.levels.length) return;
    const arr = [...v.levels]; [arr[i], arr[j]] = [arr[j], arr[i]];
    set('levels', arr);
  };

  const save = async () => {
    if (!v.name.trim() || v.levels.length === 0) return;
    setSaving(true);
    try {
      const body = JSON.stringify({
        ...v,
        levels: v.levels.map(l => ({ practice_id: l.practice_id, duration_days: parseInt(l.duration_days) || 1 })),
      });
      if (isNew) await api('/api/admin/programs', { method:'POST', body });
      else await api(`/api/admin/programs/${program.id}`, { method:'PUT', body });
      await onSaved();
    } catch (e) { alert(e.message); setSaving(false); }
  };

  return (
    <div className="fade-in pt-6 pb-8">
      <header className="flex items-center justify-between mb-6">
        <button onClick={onClose} className="opacity-60 text-sm">← Назад</button>
        <h2 className="font-display text-2xl">{isNew ? 'Новая программа' : 'Изменить'}</h2>
        <div className="w-12"/>
      </header>

      <div className="space-y-5">
        <Field label="Название">
          <input type="text" value={v.name} onChange={(e) => set('name', e.target.value)} autoFocus={isNew}
            placeholder="40 дней дисциплины" className="input-field w-full px-4 py-3 rounded-xl font-display text-xl"/>
        </Field>

        <Field label="Описание">
          <MarkdownTextarea value={v.description} onChange={(val) => set('description', val)}
                            placeholder="О чём программа, для кого, какой результат..."/>
        </Field>

        <Field label="Символ">
          <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-hide">
            {ICONS.map((i) => (
              <button key={i} onClick={() => set('icon', i)}
                className="flex-shrink-0 w-10 h-10 rounded-lg text-xl flex items-center justify-center"
                style={{
                  background: v.icon === i ? 'rgba(212,168,87,0.2)' : 'rgba(244,234,213,0.04)',
                  border: `1px solid ${v.icon === i ? 'rgba(212,168,87,0.5)' : 'rgba(244,234,213,0.08)'}`,
                }}>{i}</button>
            ))}
          </div>
        </Field>

        <Field label="Цвет">
          <div className="flex gap-2 flex-wrap">
            {PALETTES.map((p) => (
              <button key={p.n} onClick={() => set('palette', p.n)} className="w-8 h-8 rounded-full"
                style={{background: p.bg, border: `2px solid ${v.palette === p.n ? p.a : 'transparent'}`}}/>
            ))}
          </div>
        </Field>

        <Field label="При пропуске дня">
          <div className="grid grid-cols-2 gap-2">
            <TypeBtn active={v.on_miss==='reset'} onClick={() => set('on_miss','reset')} title="Сбросить" sub="Уровень начинается заново"/>
            <TypeBtn active={v.on_miss==='continue'} onClick={() => set('on_miss','continue')} title="Продолжить" sub="Засчитываем только закрытые дни"/>
          </div>
        </Field>

        <Field label="Видимость">
          <div className="grid grid-cols-2 gap-2">
            <TypeBtn active={v.visibility==='public'} onClick={() => set('visibility','public')} title="Публичная" sub="Видна всем в каталоге"/>
            <TypeBtn active={v.visibility==='individual'} onClick={() => set('visibility','individual')} title="Индивидуальная" sub="Только тем, кому назначена"/>
          </div>
        </Field>

        <div className="card rounded-xl p-4">
          <div className="flex items-center justify-between mb-3">
            <div className="text-xs uppercase tracking-wider opacity-50">Уровни</div>
            <button onClick={addLevel} className="text-xs px-3 py-1 rounded-full"
              style={{background:'rgba(212,168,87,0.15)', color:'#d4a857'}}>+ уровень</button>
          </div>
          {v.levels.length === 0 && <p className="opacity-50 text-xs">Добавь хотя бы один уровень.</p>}
          <div className="space-y-2">
            {v.levels.map((lvl, i) => (
              <div key={i} className="rounded-lg p-2 flex items-center gap-2" style={{background:'rgba(244,234,213,0.03)'}}>
                <div className="text-xs opacity-50 w-6 text-center">L{i+1}</div>
                <select value={lvl.practice_id} onChange={(e) => updateLevel(i, { practice_id: e.target.value })}
                  className="input-field flex-1 px-2 py-1.5 rounded text-sm">
                  <option value="">— выбери практику —</option>
                  {practices.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <input type="number" min="1" value={lvl.duration_days}
                  onChange={(e) => updateLevel(i, { duration_days: e.target.value })}
                  className="input-field w-16 px-2 py-1.5 rounded text-sm text-center" title="дней"/>
                <span className="text-xs opacity-50">дн.</span>
                <button onClick={() => moveLevel(i, -1)} disabled={i===0} className="w-6 h-6 rounded opacity-60 disabled:opacity-20">↑</button>
                <button onClick={() => moveLevel(i, +1)} disabled={i===v.levels.length-1} className="w-6 h-6 rounded opacity-60 disabled:opacity-20">↓</button>
                <button onClick={() => removeLevel(i)} className="w-6 h-6 rounded opacity-60" style={{color:'#e88080'}}>×</button>
              </div>
            ))}
          </div>
        </div>

        <label className="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" checked={v.active} onChange={(e) => set('active', e.target.checked)} className="w-5 h-5"/>
          <span>Активна</span>
        </label>

        <div className="flex gap-3 pt-2">
          <button onClick={onClose} className="flex-1 py-3.5 rounded-full" style={{border:'1px solid rgba(244,234,213,0.15)'}}>Отмена</button>
          <button onClick={save} disabled={!v.name.trim() || v.levels.length===0 || saving}
            className="flex-[2] py-3.5 rounded-full font-medium disabled:opacity-50"
            style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
            {saving ? 'Сохраняем...' : isNew ? 'Создать' : 'Сохранить'}
          </button>
        </div>
      </div>
    </div>
  );
}

function MotivationsTab({ practices, programs }) {

    const [kind, id] = target.split(':');

  };

  return (

          </optgroup>
        </select>
      </Field>

      {target && (
        <>
          <button onClick={() => setCreating(true)}
            className="w-full my-4 py-3 rounded-full font-medium"
            style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
            + Добавить мотивашки
          </button>

          {err && <p className="text-sm mb-3" style={{color:'#e88080'}}>{err}</p>}

          {items.length === 0 ? (
            <p className="opacity-50 text-center py-8 text-sm">Пока ни одной. Добавь — бот будет выбирать случайную из подходящих.</p>
          ) : (
            <div className="space-y-2">
              {items.map((m) => (
                <div key={m.id} className="card rounded-xl p-3 flex items-start gap-3">

                  <button onClick={() => remove(m.id)} className="text-xs opacity-60" style={{color:'#e88080'}}>×</button>
                </div>
              ))}

          )}

      )}

      {creating && (
        <MotivationCreateModal target={target} onClose={() => setCreating(false)} onSaved={async () => { setCreating(false); await load(); }}/>
      )}

  );
}

function MotivationCreateModal({ target, onClose, onSaved }) {
  const [kind, setKind] = useState('start');
  const [value, setValue] = useState(7);
  const [texts, setTexts] = useState('');
  const [saving, setSaving] = useState(false);

  const save = async () => {
    const lines = texts.split('\n').map(t => t.trim()).filter(Boolean);
    if (lines.length === 0) return;
    setSaving(true);
    try {
      const [scopeKind, scopeId] = target.split(':');
      const body = JSON.stringify({
        [scopeKind === 'practice' ? 'practice_id' : 'program_id']: scopeId,
        kind,
        value: kind === 'start' ? 0 : parseInt(value) || 0,
        texts: lines,
      });
      await api('/api/admin/motivations/bulk', { method:'POST', body });
      await onSaved();
    } catch (e) { alert(e.message); setSaving(false); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center" style={{background:'rgba(0,0,0,0.7)'}} onClick={onClose}>
      <div className="rounded-t-3xl md:rounded-3xl p-5 w-full md:max-w-lg" style={{background:'#161824', border:'1px solid rgba(244,234,213,0.08)'}} onClick={(e) => e.stopPropagation()}>
        <h3 className="font-display text-xl mb-4">Добавить мотивашки</h3>
        <Field label="Когда срабатывает">
          <div className="grid grid-cols-3 gap-2">
            {['start','streak','miss'].map(k => (
              <button key={k} onClick={() => setKind(k)} className="py-2 rounded-lg text-sm"
                style={{
                  background: kind===k ? 'rgba(212,168,87,0.15)' : 'rgba(244,234,213,0.04)',
                  border: `1px solid ${kind===k ? 'rgba(212,168,87,0.4)' : 'rgba(244,234,213,0.08)'}`,
                  color: kind===k ? '#d4a857' : '#f4ead5',
                }}>{k === 'start' ? 'Старт' : k === 'streak' ? 'Стрик' : 'Пропуск'}</button>
            ))}
          </div>
        </Field>
        {kind !== 'start' && (
          <Field label={`Число дней ${kind==='streak' ? '(стрик равен этому)' : '(пропусков подряд)'}`}>
            <input type="number" min="1" value={value} onChange={(e) => setValue(e.target.value)}
              className="input-field w-full px-4 py-3 rounded-xl"/>
          </Field>
        )}
        <Field label="Тексты (по одному на строку — бот выберет случайный)">
          <textarea value={texts} onChange={(e) => setTexts(e.target.value)} rows={8}
            placeholder={"Молодец, что начал!\nГлавное — не останавливаться.\nДень за днём.\n..."}
            className="input-field w-full px-4 py-3 rounded-xl resize-none font-mono text-sm"/>
        </Field>
        <div className="flex gap-3 pt-3">
          <button onClick={onClose} className="flex-1 py-3 rounded-full" style={{border:'1px solid rgba(244,234,213,0.15)'}}>Отмена</button>
          <button onClick={save} disabled={saving || !texts.trim()}
            className="flex-[2] py-3 rounded-full font-medium disabled:opacity-50"
            style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
            {saving ? 'Сохраняем...' : 'Добавить'}
          </button>
        </div>
      </div>
    </div>
  );
}

function AssignmentsModal({ user, practices, programs, onClose }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [target, setTarget] = useState('');

  const load = async () => {
    setLoading(true);
    try { setItems(await api(`/api/admin/users/${user.user_id}/assignments`)); }
    finally { setLoading(false); }
  };
  useEffect(() => { load(); }, []);

  const add = async () => {
    if (!target) return;
    const [target_type, target_id] = target.split(':');
    try {
      await api(`/api/admin/users/${user.user_id}/assignments`, {
        method:'POST', body: JSON.stringify({ target_type, target_id })
      });
      setTarget('');
      await load();
    } catch (e) { alert(e.message); }
  };

  const remove = async (it) => {
    if (!confirm(`Снять назначение «${it.target_name}»?`)) return;
    await api(`/api/admin/users/${user.user_id}/assignments/${it.target_type}/${it.target_id}`,
      { method:'DELETE' });
    await load();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center" style={{background:'rgba(0,0,0,0.7)'}} onClick={onClose}>
      <div className="rounded-t-3xl md:rounded-3xl p-5 w-full md:max-w-lg" style={{background:'#161824', border:'1px solid rgba(244,234,213,0.08)'}} onClick={(e) => e.stopPropagation()}>
        <h3 className="font-display text-xl mb-1">Назначения</h3>
        <p className="opacity-60 text-sm mb-4">{user.first_name || 'Без имени'} {user.username ? `@${user.username}` : ''}</p>

        {loading ? <p className="opacity-50 text-center py-4 text-sm">Загружаем...</p> : (
          items.length === 0 ? <p className="opacity-50 text-sm">Назначений нет.</p> : (
            <div className="space-y-2 mb-4">
              {items.map((it) => (
                <div key={`${it.target_type}:${it.target_id}`} className="rounded-lg p-2 flex items-center gap-3" style={{background:'rgba(244,234,213,0.04)'}}>
                  <div className="text-xs uppercase opacity-60">{it.target_type === 'practice' ? 'практ.' : 'прогр.'}</div>
                  <div className="flex-1 text-sm">{it.target_name || it.target_id}</div>
                  <button onClick={() => remove(it)} className="opacity-60" style={{color:'#e88080'}}>×</button>
                </div>
              ))}
            </div>
          )
        )}

        <Field label="Назначить ещё">
          <div className="flex gap-2">
            <select value={target} onChange={(e) => setTarget(e.target.value)}
              className="input-field flex-1 px-3 py-2 rounded-lg text-sm">
              <option value="">— выбери —</option>
              <optgroup label="Практики (скрытые из каталога)">
                {practices.filter(p => p.catalog_hidden).map(p => (
                  <option key={p.id} value={`practice:${p.id}`}>{p.name}</option>
                ))}
              </optgroup>
              <optgroup label="Практики (видны всем)">
                {practices.filter(p => !p.catalog_hidden).map(p => (
                  <option key={p.id} value={`practice:${p.id}`}>{p.name}</option>
                ))}
              </optgroup>
              <optgroup label="Программы">
                {programs.map(p => <option key={p.id} value={`program:${p.id}`}>{p.name}</option>)}

            </select>
            <button onClick={add} disabled={!target}

              style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>+</button>
          </div>
        </Field>

        <button onClick={onClose} className="w-full mt-4 py-3 rounded-full" style={{border:'1px solid rgba(244,234,213,0.15)'}}>Закрыть</button>
      </div>

}

                          <span className="text-xl">{pr.icon}</span>
                          <div className="flex-1 min-w-0">
                            <div className="font-medium truncate">{pr.name}</div>
                            <div className="text-[11px] opacity-60">
                              {pr.status === 'completed'
                                ? <>Завершена</>
                                : <>Уровень {pr.current_level} из {pr.total_levels} · {pr.current_practice_name || ''}</>}
                            </div>
                          </div>
                        </div>
                        {pr.status !== 'completed' && total > 0 && (
                          <div className="mt-2">
                            <div className="flex justify-between text-[10px] opacity-60 mb-1">
                              <span>День {pr.level_completed_days} из {total}</span><span>{pct}%</span>
                            </div>
                            <div className="h-1 rounded-full overflow-hidden" style={{background:'rgba(244,234,213,0.08)'}}>
                              <div className="h-full" style={{width:`${pct}%`, background:'linear-gradient(90deg, #d4a857, #e0bd6a)'}}/>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Подписки на практики */}
            <div className="mb-5">
              <h4 className="font-display text-lg mb-2">Практики ({(data.practices || []).length})</h4>
              {(data.practices || []).length === 0 ? (
                <p className="opacity-50 text-sm">Юзер не подписался ни на одну практику.</p>
              ) : (
                <div className="space-y-2">
                  {data.practices.map((p) => (
                    <div key={p.id} className="rounded-lg p-3" style={{background:'rgba(244,234,213,0.04)'}}>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-lg">{p.icon}</span>
                        <div className="flex-1 min-w-0 font-medium truncate">{p.name}</div>
                        {p.is_active
                          ? <span className="text-[10px] px-2 py-0.5 rounded-full" style={{background:'rgba(163,177,138,0.15)', color:'#a3b18a'}}>активна</span>
                          : <span className="text-[10px] px-2 py-0.5 rounded-full opacity-60" style={{background:'rgba(244,234,213,0.06)'}}>истекла</span>}
                      </div>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-[11px] opacity-70">
                        <div>стрик: <span style={{color:'#d4a857'}}>{p.current_streak}</span> · рекорд {p.best_streak}</div>
                        <div>выполнено: {p.total_done_days} дн.</div>
                        <div>последняя отм.: {p.last_done_date ? fmtDate(p.last_done_date) : '—'}</div>
                        <div>период: {p.period_type}{p.period_end ? ` до ${fmtDate(p.period_end)}` : ''}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Журнал отметок */}
            <div>
              <h4 className="font-display text-lg mb-2">Отметки (последние 60 дней, {(data.entries || []).length})</h4>
              {(data.entries || []).length === 0 ? (
                <p className="opacity-50 text-sm">За последние 60 дней — ни одной отметки.</p>
              ) : (
                <div className="space-y-1 text-sm">
                  {data.entries.map((e, i) => {
                    const t = e.practice_type;
                    const done = t === 'binary' ? e.completed
                      : t === 'count' ? e.count >= (e.practice_target || 1)
                      : t === 'text'  ? !!(e.response_text || '').trim()
                      : t === 'photo' ? !!e.response_photo
                      : t === 'video' ? !!(e.response_video_url || '').trim()
                      : t === 'rounds' ? !!e.completed
                      : t === 'timer'  ? (e.count || 0) >= (e.practice_target || 1)
                      : false;
                    const hasText  = !!(e.response_text  || '').trim();
                    const hasPhoto = !!e.response_photo;
                    const hasVideo = !!(e.response_video_url || '').trim();
                    return (
                      <div key={i} className="rounded-md px-2 py-1.5" style={{background:'rgba(244,234,213,0.03)'}}>
                        <div className="flex items-center gap-2">
                          <span className="text-xs opacity-60 w-14 flex-shrink-0">{fmtDate(e.date)}</span>
                          <span>{e.practice_icon}</span>
                          <span className="flex-1 truncate opacity-90">{e.practice_name}</span>
                          <span className="text-xs" style={{color: done ? '#a3b18a' : '#e0bd6a'}}>
                            {t === 'binary' && (e.completed ? '✓ выполнено' : '— не закрыто')}
                            {t === 'count'  && `${e.count}${e.practice_unit ? ' ' + e.practice_unit : ''} / ${e.practice_target || 1}`}
                            {t === 'text'   && (done ? '✓ ответ' : '—')}
                            {t === 'photo'  && (done ? '✓ фото' : '—')}
                            {t === 'video'  && (done ? '✓ видео' : '—')}
                            {t === 'rounds' && (done ? '✓ раунды пройдены' : '— не завершено')}
                            {t === 'timer'  && `${e.count || 0}с / ${e.practice_target || 1}с`}
                          </span>
                          <span className="text-[10px] opacity-40 hidden md:inline">{fmtTs(e.ts)}</span>
                        </div>
                        {hasText && (
                          <div className="mt-1 ml-16 text-xs opacity-80 whitespace-pre-wrap">{e.response_text}</div>
                        )}
                        {hasPhoto && (
                          <div className="mt-1 ml-16">
                            <a href={e.response_photo} target="_blank" rel="noopener">
                              <img src={e.response_photo} className="max-h-40 rounded-lg"/>
                            </a>
                          </div>
                        )}
                        {hasVideo && (
                          <div className="mt-1 ml-16 text-xs">
                            <a href={e.response_video_url} target="_blank" rel="noopener"
                               className="underline opacity-80 break-all" style={{color:'#d4a857'}}>
                              {e.response_video_url}
                            </a>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </>
        )}

        <button onClick={onClose} className="w-full mt-5 py-3 rounded-full" style={{border:'1px solid rgba(244,234,213,0.15)'}}>Закрыть</button>
      </div>
    </div>
  );
}

function PracticeForm({ practice, categories, onClose, onSaved }) {
  const isNew = !practice.id;
  const [v, setV] = useState({
    name: practice.name || '',
    description: practice.description || '',
    type: practice.type || 'binary',
    target: practice.target?.toString() || '10',
    unit: practice.unit || '',
    icon: practice.icon || ICONS[0],
    palette: practice.palette || 'amber',
    media_url: practice.media_url || '',
    media_label: practice.media_label || '',
    audios: Array.isArray(practice.audios) ? practice.audios.slice(0, 3) : [],
    photo: practice.photo || null,
    max_reminders: practice.max_reminders ?? 3,
    reminder_from: practice.reminder_from || '08:00',
    reminder_to: practice.reminder_to || '21:00',
    active: practice.active !== false,
    catalog_hidden: practice.catalog_hidden === true,
    extras: practice.extras || [],
    rounds_count: practice.rounds_count?.toString() || '5',
    work_seconds: practice.work_seconds?.toString() || '20',
    rest_seconds: practice.rest_seconds?.toString() || '20',
    rounds_plan: Array.isArray(practice.rounds_plan) ? practice.rounds_plan : [],
    category_ids: practice.category_ids || [],
    tag_frequency: practice.tag_frequency || [],
    tag_activity:  practice.tag_activity  || [],
    tag_inventory: practice.tag_inventory || [],
    tag_location:  practice.tag_location  || [],
  });
  const [saving, setSaving] = useState(false);
  const set = (k, val) => setV((s) => ({...s, [k]: val}));

  const save = async () => {
    if (!v.name.trim()) return;
    setSaving(true);
    try {
      const payload = {
        ...v,
        target: v.type === 'count' ? parseInt(v.target) || 1
              : v.type === 'timer' ? Math.max(1, parseInt(v.target) || 60)
              : null,
        rounds_count: v.type === 'rounds' ? Math.max(1, parseInt(v.rounds_count) || 1) : null,
        work_seconds: v.type === 'rounds' ? Math.max(1, parseInt(v.work_seconds) || 1) : null,
        rest_seconds: v.type === 'rounds' ? Math.max(0, parseInt(v.rest_seconds) || 0) : null,
        rounds_plan: v.type === 'rounds' ? (v.rounds_plan || []).map((r) => ({
          work: Math.max(1, parseInt(r.work) || 1),
          rest: Math.max(0, parseInt(r.rest) || 0),
          sound_url: (r.sound_url || '').trim(),
          note: (r.note || '').trim(),
        })) : [],
      };
      const body = JSON.stringify(payload);
      if (isNew) await api('/api/admin/practices', { method:'POST', body });
      else await api(`/api/admin/practices/${practice.id}`, { method:'PUT', body });
      await onSaved();
    } catch (e) { alert(e.message); setSaving(false); }
  };

  const handlePhoto = async (file) => {
    if (!file) return;
    const c = await compress(file);
    set('photo', c);
  };

  const toggleCategory = (id) => {
    set('category_ids', v.category_ids.includes(id)
      ? v.category_ids.filter(x => x !== id)
      : [...v.category_ids, id]);
  };

  return (
    <div className="fade-in pt-6 pb-8">
      <header className="flex items-center justify-between mb-6">
        <button onClick={onClose} className="opacity-60 text-sm">← Назад</button>
        <h2 className="font-display text-2xl">{isNew ? 'Новая практика' : 'Изменить'}</h2>
        <div className="w-12"/>
      </header>

      <div className="space-y-5">
        <Field label="Название">
          <input type="text" value={v.name} onChange={(e) => set('name', e.target.value)} autoFocus={isNew}
            placeholder="Утренняя медитация" className="input-field w-full px-4 py-3 rounded-xl font-display text-xl"/>
        </Field>

        <Field label="Описание">
          <MarkdownTextarea value={v.description} onChange={(val) => set('description', val)}
                            placeholder={"Зачем эта практика, инструкция...\n\nПоддерживается Markdown:\n**жирный**, *курсив*, # Заголовок,\n- список, > цитата, [ссылка](https://...)"}/>
        </Field>

        <Field label="Основной тип (обязательно для «день засчитан»)">
          <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
            <TypeBtn active={v.type==='binary'} onClick={() => set('type','binary')} title="Факт" sub="Сделано или нет"/>
            <TypeBtn active={v.type==='count'} onClick={() => set('type','count')} title="Количество" sub="С целью на день"/>
            <TypeBtn active={v.type==='text'} onClick={() => set('type','text')} title="Текст" sub="Написать ответ"/>
            <TypeBtn active={v.type==='photo'} onClick={() => set('type','photo')} title="Фото" sub="Загрузить снимок"/>
            <TypeBtn active={v.type==='video'} onClick={() => set('type','video')} title="Видео" sub="Ссылка на видео"/>
            <TypeBtn active={v.type==='rounds'} onClick={() => set('type','rounds')} title="Раунды" sub="Интервалы со звуком"/>
            <TypeBtn active={v.type==='timer'} onClick={() => set('type','timer')} title="Таймер" sub="Секундомер (например, планка)"/>
          </div>
        </Field>

        <Field label="Дополнительные опциональные поля">
          <p className="text-xs opacity-50 mb-2">Юзер может (но не обязан) приложить к отметке. На «день засчитан» не влияют — только основной тип.</p>
          <div className="grid grid-cols-3 gap-2">
            {['text','photo','video'].filter(k => k !== v.type).map((k) => {
              const on = (v.extras || []).includes(k);
              return (
                <button key={k} onClick={() => set('extras', on ? v.extras.filter(x => x !== k) : [...(v.extras || []), k])}
                  className="py-2 rounded-lg text-sm"
                  style={{
                    background: on ? 'rgba(212,168,87,0.12)' : 'rgba(244,234,213,0.04)',
                    border: `1px solid ${on ? 'rgba(212,168,87,0.4)' : 'rgba(244,234,213,0.1)'}`,
                    color: on ? '#d4a857' : '#f4ead5',
                  }}>
                  {k === 'text' ? 'Текст' : k === 'photo' ? 'Фото' : 'Видео'}
                </button>
              );
            })}
          </div>
        </Field>

        {v.type === 'count' && (
          <div className="grid grid-cols-2 gap-3">
            <Field label="Цель в день">
              <input type="number" min="1" value={v.target} onChange={(e) => set('target', e.target.value)} className="input-field w-full px-4 py-3 rounded-xl"/>
            </Field>
            <Field label="Единица">
              <input type="text" value={v.unit} onChange={(e) => set('unit', e.target.value)} placeholder="мин, кругов, стр" className="input-field w-full px-4 py-3 rounded-xl"/>
            </Field>
          </div>
        )}

        {v.type === 'timer' && (
          <>
            <p className="text-xs opacity-60 -mt-2">
              Секундомер. Юзер запускает таймер, останавливает когда сдался — лучший результат за день сохраняется.
              День засчитан, если рекорд ≥ цели.
            </p>
            <Field label="Цель, сек">
              <input type="number" min="1" value={v.target}
                onChange={(e) => set('target', e.target.value)}
                placeholder="300"
                className="input-field w-full px-4 py-3 rounded-xl"/>
            </Field>
          </>
        )}

        {v.type === 'rounds' && (
          <>
            <p className="text-xs opacity-60 -mt-2">
              Интервальная тренировка: N подходов, каждый по «работа» секунд, между ними «пауза» секунд.
              В Mini App юзеру будет таймер со звуковыми сигналами (старт работы / старт паузы / финал).
            </p>
            <div className="grid grid-cols-3 gap-3">
              <Field label="Раундов">
                <input type="number" min="1" max="100" value={v.rounds_count}
                  onChange={(e) => set('rounds_count', e.target.value)}
                  className="input-field w-full px-4 py-3 rounded-xl"/>
              </Field>
              <Field label="Работа, сек">
                <input type="number" min="1" max="3600" value={v.work_seconds}
                  onChange={(e) => set('work_seconds', e.target.value)}
                  className="input-field w-full px-4 py-3 rounded-xl"/>
              </Field>
              <Field label="Пауза, сек">
                <input type="number" min="0" max="3600" value={v.rest_seconds}
                  onChange={(e) => set('rest_seconds', e.target.value)}
                  className="input-field w-full px-4 py-3 rounded-xl"/>
              </Field>
            </div>
            <Field label="Описание задачи в раунде (необязательно)">
              <input type="text" value={v.unit} onChange={(e) => set('unit', e.target.value)}
                placeholder="например: 20 отжиманий"
                className="input-field w-full px-4 py-3 rounded-xl"/>
            </Field>

            <div className="card rounded-xl p-4">
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs uppercase tracking-wider opacity-50">Индивидуальные раунды</div>
                <label className="flex items-center gap-2 text-xs cursor-pointer">
                  <input type="checkbox" checked={(v.rounds_plan || []).length > 0}
                         onChange={(e) => {
                           if (e.target.checked) {
                             const n = Math.max(1, parseInt(v.rounds_count) || 1);
                             const w = Math.max(1, parseInt(v.work_seconds) || 20);
                             const r = Math.max(0, parseInt(v.rest_seconds) || 0);
                             set('rounds_plan', Array.from({length: n}, () => ({work: w, rest: r, sound_url: '', note: ''})));
                           } else {
                             set('rounds_plan', []);
                           }
                         }}/>
                  включить
                </label>
              </div>
              {(v.rounds_plan || []).length === 0 ? (
                <p className="text-[11px] opacity-60">
                  Если включить — каждый раунд можно настроить отдельно: своё время работы/паузы и свой звук.
                  Иначе все раунды одинаковые по полям выше.
                </p>
              ) : (
                <div className="space-y-2">
                  {v.rounds_plan.map((r, i) => (
                    <div key={i} className="rounded-lg p-2" style={{background:'rgba(244,234,213,0.04)', border:'1px solid rgba(244,234,213,0.08)'}}>
                      <div className="flex items-center gap-2 mb-1.5">
                        <span className="text-xs opacity-60 w-8">#{i+1}</span>
                        <input type="number" min="1" max="3600" value={r.work}
                          onChange={(e) => set('rounds_plan', v.rounds_plan.map((x,j) => j===i ? {...x, work: e.target.value} : x))}
                          placeholder="работа"
                          className="input-field w-20 px-2 py-1.5 rounded-md text-sm"/>
                        <span className="text-[10px] opacity-50">сек</span>
                        <span className="opacity-40">/</span>
                        <input type="number" min="0" max="3600" value={r.rest}
                          onChange={(e) => set('rounds_plan', v.rounds_plan.map((x,j) => j===i ? {...x, rest: e.target.value} : x))}
                          placeholder="пауза"
                          className="input-field w-20 px-2 py-1.5 rounded-md text-sm"/>
                        <span className="text-[10px] opacity-50">пауза</span>
                        <button type="button" onClick={() => set('rounds_plan', v.rounds_plan.filter((_,j) => j !== i))}
                                className="ml-auto px-2 py-1 rounded-md text-sm opacity-60 hover:opacity-100">×</button>
                      </div>
                      <textarea value={r.note || ''}
                                onChange={(e) => set('rounds_plan', v.rounds_plan.map((x,j) => j===i ? {...x, note: e.target.value} : x))}
                                placeholder="инструкция в раунде (что делать) — покажется поверх таймера"
                                rows={2}
                                className="input-field w-full px-3 py-1.5 rounded-md text-xs resize-y mb-1.5"/>
                      <AudioPicker url={r.sound_url || ''}
                                   onChange={(url) => set('rounds_plan', v.rounds_plan.map((x,j) => j===i ? {...x, sound_url: url} : x))}
                                   placeholder="звук раунда (необяз.) — иначе стандартный бип"/>
                    </div>
                  ))}
                  {v.rounds_plan.length < 100 && (
                    <button type="button"
                            onClick={() => {
                              const last = v.rounds_plan[v.rounds_plan.length - 1] || {work: 20, rest: 10, sound_url: '', note: ''};
                              set('rounds_plan', [...v.rounds_plan, {work: last.work, rest: last.rest, sound_url: '', note: ''}]);
                            }}
                            className="w-full py-2 rounded-lg text-sm opacity-70 hover:opacity-100"
                            style={{border:'1px dashed rgba(244,234,213,0.15)'}}>
                      + добавить раунд
                    </button>
                  )}
                </div>
              )}
            </div>
          </>
        )}

        <Field label="Категории">
          <CategoryPicker categories={categories} selected={v.category_ids} onToggle={toggleCategory}/>
        </Field>

        <Field label="Частота / время">
          <TagEditor value={v.tag_frequency} onChange={(t) => set('tag_frequency', t)}
            suggestions={['ежедневная','утренняя','дневная','вечерняя','несколько раз в день','несколько раз в неделю','разовая']}/>
        </Field>

        <Field label="Активность">
          <TagEditor value={v.tag_activity} onChange={(t) => set('tag_activity', t)}
            suggestions={['пассивная','спокойная','умеренная','активная','интенсивная']}/>
        </Field>

        <Field label="Инвентарь">
          <TagEditor value={v.tag_inventory} onChange={(t) => set('tag_inventory', t)}
            suggestions={['коврик','скакалка','гантели','мяч','эспандер','скамья','подушка','чётки','блокнот']}
            allowCustom/>
        </Field>

        <Field label="Место">
          <TagEditor value={v.tag_location} onChange={(t) => set('tag_location', t)}
            suggestions={['дом','улица','зал','природа','офис','где угодно']}
            allowCustom/>
        </Field>

        <Field label="Символ">
          <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-hide">
            {ICONS.map((i) => (
              <button key={i} onClick={() => set('icon', i)}
                className="flex-shrink-0 w-10 h-10 rounded-lg text-xl flex items-center justify-center"
                style={{
                  background: v.icon === i ? 'rgba(212,168,87,0.2)' : 'rgba(244,234,213,0.04)',
                  border: `1px solid ${v.icon === i ? 'rgba(212,168,87,0.5)' : 'rgba(244,234,213,0.08)'}`,
                }}>{i}</button>
            ))}
          </div>
        </Field>

        <Field label="Цвет">
          <div className="flex gap-2 flex-wrap">
            {PALETTES.map((p) => (
              <button key={p.n} onClick={() => set('palette', p.n)} className="w-8 h-8 rounded-full"
                style={{background: p.bg, border: `2px solid ${v.palette === p.n ? p.a : 'transparent'}`}}/>
            ))}
          </div>
        </Field>

        <Field label="Фото практики">
          {v.photo ? (
            <div className="relative rounded-xl overflow-hidden" style={{border:'1px solid rgba(244,234,213,0.1)'}}>
              <img src={v.photo} className="w-full max-h-48 object-cover"/>
              <button onClick={() => set('photo', null)} className="absolute top-2 right-2 w-7 h-7 rounded-full" style={{background:'rgba(10,12,20,0.7)'}}>×</button>
            </div>
          ) : (
            <label className="block p-4 rounded-xl text-center text-sm opacity-60 cursor-pointer" style={{border:'1px dashed rgba(244,234,213,0.15)'}}>
              Загрузить фото
              <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhoto(e.target.files?.[0])}/>
            </label>
          )}
        </Field>

        <Field label="Видео / материал (для инструкции — покажется сверху во время практики)">
          <VideoPicker url={v.media_url} onChange={(url) => set('media_url', url)}/>
          {v.media_url && <input type="text" value={v.media_label} onChange={(e) => set('media_label', e.target.value)} placeholder="Название (необязат.)" className="input-field w-full px-4 py-2 rounded-lg text-sm mt-2"/>}
        </Field>

        <Field label="Аудио при старте практики (до 3 шт., проигрываются по очереди)">
          <div className="space-y-2">
            {v.audios.map((a, i) => (
              <div key={i} className="rounded-xl p-2.5"
                   style={{background:'rgba(244,234,213,0.03)', border:'1px solid rgba(244,234,213,0.08)'}}>
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-xs opacity-60">Аудио #{i+1}</span>
                  <button type="button" onClick={() => set('audios', v.audios.filter((_, j) => j !== i))}

                <input type="text" value={a.label || ''}
                       onChange={(e) => set('audios', v.audios.map((x, j) => j===i ? {...x, label: e.target.value} : x))}

          </div>
        </Field>

        <div className="card rounded-xl p-4">
          <div className="text-xs uppercase tracking-wider opacity-50 mb-3">Напоминания</div>

            <div className="flex justify-between text-[10px] opacity-50 mt-1">
              <span>0 — не напоминать</span><span>10 — макс</span>
            </div>
          </Field>
          <div className="grid grid-cols-2 gap-3 mt-4">
            <Field label="С">
              <input type="time" value={v.reminder_from} onChange={(e) => set('reminder_from', e.target.value)} className="input-field w-full px-4 py-3 rounded-xl"/>
            </Field>
            <Field label="До">
              <input type="time" value={v.reminder_to} onChange={(e) => set('reminder_to', e.target.value)} className="input-field w-full px-4 py-3 rounded-xl"/>
            </Field>
          </div>
        </div>

        <label className="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" checked={v.active} onChange={(e) => set('active', e.target.checked)} className="w-5 h-5"/>
          <span>Активна (показывать в каталоге)</span>
        </label>

        <label className="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" checked={v.catalog_hidden} onChange={(e) => set('catalog_hidden', e.target.checked)} className="w-5 h-5"/>
          <span>Скрыть из общего каталога <span className="opacity-50 text-xs">(только как уровень программы или по индив. назначению)</span></span>
        </label>

          <button onClick={onClose} className="flex-1 py-3.5 rounded-full" style={{border:'1px solid rgba(244,234,213,0.15)'}}>Отмена</button>
          <button onClick={save} disabled={!v.name.trim() || saving}
            className="flex-[2] py-3.5 rounded-full font-medium disabled:opacity-50"
            style={{background:'linear-gradient(135deg, #d4a857, #b8902f)', color:'#1a1410'}}>
            {saving ? 'Сохраняем...' : isNew ? 'Создать' : 'Сохранить'}
          </button>
        </div>
      </div>
    </div>
  );
}

function CategoryPicker({ categories, selected, onToggle }) {
  const tree = useMemo(() => buildTree(categories), [categories]);
  if (categories.length === 0) {
    return <p className="text-sm opacity-50">Категорий ещё нет. Создай их во вкладке «Категории» — потом сможешь привязать.</p>;
  }
  const renderNode = (node) => (
    <div key={node.id}>
      <label className="flex items-center gap-2 py-1.5 cursor-pointer" style={{paddingLeft: (node.level - 1) * 16}}>
        <input type="checkbox" checked={selected.includes(node.id)} onChange={() => onToggle(node.id)} className="w-4 h-4"/>
        <span className="text-sm">{node.name}</span>
        <span className="text-[10px] opacity-40 font-mono">L{node.level}</span>
      </label>
      {(node.children || []).map(renderNode)}
    </div>
  );
  return (
    <div className="card rounded-xl p-3 max-h-64 overflow-y-auto">
      {tree.map(renderNode)}
    </div>
  );
}

// Подбор аудио: URL вручную / импорт с Яндекс.Диска / загрузка файла на сервер.
// Готовый url передаём наружу через onChange. Все три способа дают на выходе
// либо внешний URL, либо локальный /photos/audios/<file>.
function AudioPicker({ url, onChange, onLabel, placeholder = 'URL аудио или загрузи файл' }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const fileRef = useRef(null);

  const uploadFile = async (file) => {
    if (!file) return;
    setErr(''); setBusy(true);
    try {
      const fd = new FormData(); fd.append('file', file);
      const r = await fetch('/api/admin/audio/upload', {
        method: 'POST', body: fd,
        headers: { 'X-Init-Data': initData, 'X-User-TZ': userTz },
      });
      if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `HTTP ${r.status}`);
      const j = await r.json();
      onChange(j.url);
      if (onLabel && j.label && !onLabel.current) onLabel.set(j.label);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); if (fileRef.current) fileRef.current.value = ''; }
  };

  const importYandex = async () => {
    const link = prompt('Вставь публичную ссылку Яндекс.Диска (https://disk.yandex.ru/d/... или /i/...):');
    if (!link) return;
    setErr(''); setBusy(true);
    try {
      const r = await api('/api/admin/audio/import_yandex', {
        method: 'POST', body: JSON.stringify({ url: link.trim() }),
      });
      onChange(r.url);
      if (onLabel && r.label && !onLabel.current) onLabel.set(r.label);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  const isLocal = url && url.startsWith('/photos/');
  return (
    <div>
      <div className="flex gap-1 mb-1.5 flex-wrap">
        <button type="button" disabled={busy} onClick={() => fileRef.current?.click()}
                className="text-xs px-2.5 py-1.5 rounded-lg opacity-80 hover:opacity-100 disabled:opacity-40"
                style={{background:'rgba(212,168,87,0.1)', border:'1px solid rgba(212,168,87,0.3)', color:'#d4a857'}}>
          {busy ? '...' : '📤 загрузить файл'}
        </button>
        <button type="button" disabled={busy} onClick={importYandex}
                className="text-xs px-2.5 py-1.5 rounded-lg opacity-80 hover:opacity-100 disabled:opacity-40"
                style={{background:'rgba(127,179,211,0.1)', border:'1px solid rgba(127,179,211,0.3)', color:'#b8d3e6'}}>
          {busy ? '...' : '💾 с Яндекс.Диска'}
        </button>
        {url && (
          <button type="button" onClick={() => onChange('')}
                  className="text-xs px-2.5 py-1.5 rounded-lg opacity-50 hover:opacity-100">
            очистить
          </button>
        )}
      </div>
      <input type="file" accept="audio/*" ref={fileRef} className="hidden"
             onChange={(e) => uploadFile(e.target.files?.[0])}/>
      <input type="url" value={url || ''}
             onChange={(e) => onChange(e.target.value)}
             placeholder={placeholder}
             className="input-field w-full px-3 py-2 rounded-lg text-xs"/>
      {url && (
        <div className="mt-1.5">
          <audio src={url} controls preload="none" style={{width:'100%', height:'32px'}}/>
          {isLocal && <p className="text-[10px] opacity-50 mt-0.5">Хранится на сервере: {url}</p>}
        </div>
      )}
      {err && <p className="text-[11px] mt-1" style={{color:'#e88080'}}>{err}</p>}
    </div>
  );
}

const Field = ({ label, children }) => (
  <div>
    <label className="block text-xs uppercase tracking-wider opacity-50 mb-2">{label}</label>
    {children}
  </div>
);

const renderMarkdown = (text) => {
  if (!text) return '';
  try {
    if (typeof marked !== 'undefined') return marked.parse(String(text), { breaks: true, gfm: true });
  } catch (e) {}
  return String(text).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])).replace(/\n/g, '<br>');
};

// Textarea с переключателем «текст / предпросмотр» и кнопками-подсказками
// (жирный, курсив, заголовок, список, цитата, ссылка) — вставляют markdown-разметку вокруг выделения.
function MarkdownTextarea({ value, onChange, placeholder, rows = 8 }) {
  const [tab, setTab] = useState('edit');
  const ref = useRef(null);
  const wrap = (before, after = before, fallback = '') => {
    const el = ref.current; if (!el) return;
    const start = el.selectionStart, end = el.selectionEnd;
    const sel = value.slice(start, end) || fallback;
    const next = value.slice(0, start) + before + sel + after + value.slice(end);
    onChange(next);
    setTimeout(() => {
      el.focus();
      const pos = start + before.length + sel.length;
      el.setSelectionRange(pos, pos);
    }, 0);
  };
  const linePrefix = (prefix) => {
    const el = ref.current; if (!el) return;
    const start = el.selectionStart, end = el.selectionEnd;
    const lineStart = value.lastIndexOf('\n', start - 1) + 1;
    const lineEnd = value.indexOf('\n', end); const realEnd = lineEnd === -1 ? value.length : lineEnd;
    const block = value.slice(lineStart, realEnd);
    const newBlock = block.split('\n').map((ln) => prefix + ln).join('\n');
    onChange(value.slice(0, lineStart) + newBlock + value.slice(realEnd));
  };
  const btn = "px-2 py-1 rounded-md text-xs opacity-70 hover:opacity-100";
  const btnStyle = { background: 'rgba(244,234,213,0.06)', border: '1px solid rgba(244,234,213,0.1)' };
  return (
    <div>
      <div className="flex flex-wrap items-center gap-1 mb-2">
        <button type="button" className={btn} style={btnStyle} onClick={() => wrap('**', '**', 'жирный')}><b>B</b></button>
        <button type="button" className={btn} style={btnStyle} onClick={() => wrap('*', '*', 'курсив')}><i>I</i></button>
        <button type="button" className={btn} style={btnStyle} onClick={() => linePrefix('## ')}>H</button>
        <button type="button" className={btn} style={btnStyle} onClick={() => linePrefix('- ')}>• список</button>
        <button type="button" className={btn} style={btnStyle} onClick={() => linePrefix('1. ')}>1. список</button>
        <button type="button" className={btn} style={btnStyle} onClick={() => linePrefix('> ')}>“ цитата</button>
        <button type="button" className={btn} style={btnStyle} onClick={() => wrap('[', '](https://)', 'ссылка')}>🔗</button>
        <button type="button" className={btn} style={btnStyle} onClick={() => wrap('`', '`', 'code')}>{'</>'}</button>
        <div className="ml-auto flex gap-1">
          <button type="button" onClick={() => setTab('edit')} className={btn}
                  style={tab === 'edit' ? {background:'rgba(212,168,87,0.18)', color:'#d4a857', border:'1px solid rgba(212,168,87,0.4)'} : btnStyle}>текст</button>
          <button type="button" onClick={() => setTab('preview')} className={btn}
                  style={tab === 'preview' ? {background:'rgba(212,168,87,0.18)', color:'#d4a857', border:'1px solid rgba(212,168,87,0.4)'} : btnStyle}>превью</button>
        </div>
      </div>
      {tab === 'edit' ? (
        <textarea ref={ref} value={value} onChange={(e) => onChange(e.target.value)} rows={rows}
          placeholder={placeholder}
          className="input-field w-full px-4 py-3 rounded-xl resize-y font-mono"
          style={{fontSize: '13px', lineHeight: 1.5}}/>
      ) : (
        <div className="input-field w-full px-4 py-3 rounded-xl" style={{minHeight: `${rows * 1.5 + 1.5}em`}}>
          {value
            ? <div className="md-body" dangerouslySetInnerHTML={{__html: renderMarkdown(value)}}/>
            : <span className="opacity-40 text-sm">Здесь появится превью оформленного текста</span>}
        </div>
      )}
      <p className="text-[11px] opacity-50 mt-1.5">
        Поддерживается Markdown: <b>**жирный**</b>, <i>*курсив*</i>, <code>## заголовок</code>, <code>- список</code>, <code>&gt; цитата</code>, <code>[ссылка](https://...)</code>
      </p>
    </div>
  );
}

function TagEditor({ value, onChange, suggestions = [], allowCustom = false }) {
  const [custom, setCustom] = useState('');
  const selected = value || [];
  const isOn = (t) => selected.includes(t);
  const toggle = (t) => onChange(isOn(t) ? selected.filter(x => x !== t) : [...selected, t]);
  const addCustom = () => {
    const s = custom.trim();
    if (!s) return;
    if (!isOn(s)) onChange([...selected, s]);
    setCustom('');
  };
  // Все теги: подсказки + кастомные (которые не из подсказок)
  const customTags = selected.filter(t => !suggestions.includes(t));
  return (
    <div>
      <div className="flex flex-wrap gap-1.5">
        {suggestions.map((t) => (
          <button key={t} onClick={() => toggle(t)} className="px-3 py-1 rounded-full text-xs"
            style={{
              background: isOn(t) ? 'rgba(212,168,87,0.15)' : 'rgba(244,234,213,0.04)',
              border: `1px solid ${isOn(t) ? 'rgba(212,168,87,0.4)' : 'rgba(244,234,213,0.1)'}`,
              color: isOn(t) ? '#d4a857' : '#f4ead5',
            }}>{t}</button>
        ))}
        {customTags.map((t) => (
          <button key={t} onClick={() => toggle(t)} className="px-3 py-1 rounded-full text-xs flex items-center gap-1"
            style={{background:'rgba(212,168,87,0.12)', border:'1px solid rgba(212,168,87,0.4)', color:'#d4a857'}}>
            {t}<span className="opacity-60">×</span>
          </button>
        ))}
      </div>
      {allowCustom && (
        <div className="mt-2 flex gap-2">
          <input value={custom} onChange={(e) => setCustom(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } }}
            placeholder="свой вариант…"
            className="input-field flex-1 px-3 py-1.5 rounded-lg text-sm"/>
          <button onClick={addCustom} className="px-3 py-1.5 rounded-lg text-sm"
            style={{background:'rgba(212,168,87,0.15)', color:'#d4a857', border:'1px solid rgba(212,168,87,0.4)'}}>+</button>
        </div>
      )}
    </div>
  );
}

const TypeBtn = ({ active, onClick, title, sub }) => (
